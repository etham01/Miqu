      reason: >-
        种子只有 1 个管理员（admin id=1）。管理员操作自己 → USER-014 的
        CANNOT_OPERATE_SELF(400) 先命中（layer 4 内先书写）。无第二个管理员 → 无输入可触达。
      corresponding_issue: M-01
      registered_gap: SEC-004
      to_cover: "补第二个管理员种子账号，或用直接改库/直接调 Service 的集成测试"

    - id: DB-04
