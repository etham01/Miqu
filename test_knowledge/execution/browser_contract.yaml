# ═══════════════════════════════════════════════════════════════
# 5. 生成模板
# ═══════════════════════════════════════════════════════════════
templates:
  - id: BT-01
    name: 新增一个前端状态一致性断言组
    code: |
      // ============================================================
      // BUG-0XX：<一句话说清"什么条件下，UI 与数据必须同源">
      // ============================================================
      console.log('\n[BUG-0XX] <组标题>')

      {
        // 1) 用 API 造前置数据（不走 UI —— 保持 setup 快速且确定）
        const token = await loginAs('test001')
        const before = await api('GET', '/api/posts?tab=latest&page=1&size=10', { token })

        // 2) 打开页面，并在**请求仍在飞**时立刻触发筛选变更
        const page = await browser.newPage()
        const reqs = []
        page.on('request', (r) => { if (r.url().includes('/api/posts')) reqs.push(r.url()) })

        await page.goto(`${WEB}/`, { waitUntil: 'domcontentloaded' })
        await page.getByText('我的关注').click()          // 不等首屏加载完就点

        // 3) 断言：UI 选中态 与 数据来源 必须一致
        const active = await page.locator('.tab.active').innerText()
        assert('BUG-0XX.a', '切 tab 后高亮为「我的关注」', active.includes('我的关注'), `高亮=${active}`)

        const askedFollowing = reqs.some((u) => u.includes('tab=following'))
        assert('BUG-0XX.b', '切 tab 后补发了 tab=following 请求', askedFollowing, reqs.join(' | ') || '(无)')

        await page.close()
      }
    notes:
      - "不等首屏加载完就触发下一次交互 —— 这是复现竞态的关键，配合 MIQU_SLOW_MS 放大窗口"
      - "监听 request 事件来验证「请求到底发出去了没有」，这是本脚本的核心手法"
      - "每组用具名断言 ID，便于 test_cases/*.yaml 用 browser 字段引用"

  - id: BT-02
    name: 新增一个 UI 降级断言组
    code: |
      console.log('\n[BUG-0XX] <降级场景>')
      {
        // 用"合法前缀 + 不存在的文件"造出取不到的图片
        const token = await loginAs('test001')
        const missing = `/uploads/image/2026/09/${Date.now().toString(16)}.jpg`
        const put = await api('PUT', '/api/users/me/avatar', { token, body: { avatar: missing } })
        assert('BUG-0XX.a', '造出一个指向不存在文件的头像', put.code === 200, `code=${put.code}`)

        const page = await browser.newPage()
        await page.goto(`${WEB}/profile`, { waitUntil: 'networkidle' })

        const broken = await page.locator('img').evaluateAll(
          (imgs) => imgs.filter((i) => i.complete && i.naturalWidth === 0).length)
        assert('BUG-0XX.b', '页面上不再有解码失败的 <img>', broken === 0, `broken=${broken}`)

        const fallback = await page.locator('.avatar-fallback').count()
        assert('BUG-0XX.c', '降级成了首字母占位', fallback > 0, `fallback=${fallback}`)
        await page.close()
      }

# ═══════════════════════════════════════════════════════════════
# 6. 反模式
# ═══════════════════════════════════════════════════════════════
anti_patterns:
  - id: BAP-01
    wrong: "把前端状态一致性的用例改写成 pytest（直接打接口断言数据）"
    why: "后端返回永远是对的 —— pytest 版本会**永远绿**，失去发现缺陷的能力"
    right: "保留在浏览器层"
  - id: BAP-02
    wrong: "用 127.0.0.1 访问前端"
    why: "Vite 只监听 IPv6 的 ::1，会连接失败并误判为「前端挂了」"
    right: "用 localhost"
  - id: BAP-03
    wrong: "等页面完全加载完再触发筛选变更"
    why: "竞态窗口已关闭，测不出问题（会得到假绿）"
    right: "请求仍在飞时立刻交互，并用 MIQU_SLOW_MS 放大窗口"
  - id: BAP-04
    wrong: "只断言最终 UI 状态，不检查请求是否发出"
    why: "无法区分「数据恰好相同」与「确实重新取了数」"
    right: "监听 request 事件，像 BUG-001.d / BUG-002.b 那样断言请求确实发出"
  - id: BAP-05
    wrong: "断言固定像素/固定文案快照"
    why: "与项目关注的「状态同源性」无关，且极易碎"
    right: "断言「高亮与数据同源」这类语义不变量"
  - id: BAP-06
    wrong: "期望浏览器层发现接口契约错误（如 code 应为 403）"
    why: "那是 pytest/JUnit 的职责，浏览器层做这个只是慢且脆"
    right: "接口契约问题留在 pytest"

