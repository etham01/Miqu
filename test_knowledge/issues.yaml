unknowns:

  - id: U-01
    topic: username 大小写是否算重复（Alice vs alice）／email 无点 TLD 是否被 @Email 接受
    why_unknown: >-
      username 的查重是 eq 精确匹配（大小写敏感），但 MySQL 的 utf8mb4_0900_ai_ci 排序规则**本身是大小写不敏感**的，
      唯一键 uk_username 的行为因此可能与应用层不一致。email 无点 TLD 是否通过取决于 Hibernate Validator 的实现细节。
    impact: "🐛 **可能是一个真实缺陷**（应用层认为不同、数据库认为相同）"
    ai_instruction: "🔴 **不要生成密码/用户名大小写的重复性用例**，也不要断言 409 或 200"
    recommended_confirmation: "实测：注册 'AliceXxx1' 后尝试注册 'alicexxx1'，看返回 409 还是 200；并核对 uk_username 的排序规则"

  - id: U-02
    topic: conversation 的 CHECK 约束在真实并发下的行为
    basis: "schema.sql:157 有 ck_user_order；Service 层用 Math.min/max 规整，正常不会违反"
    ai_instruction: "不要生成「故意传反序触发 CHECK」的用例 —— 接口层无法直接指定 user1/user2"

  - id: U-03
    topic: 路径参数 id=0 的行为
    detail: "0 是合法 Long，能匹配白名单正则 {id:[0-9]+}，但库中无 id=0 → 预期 404。**未见测试验证**"
    ai_instruction: "若要生成，先实测确认 404 而非 400"
    cross_ref: [data/test_data.yaml → special_id_values]

  - id: U-04
    topic: 负数 id 的行为
    detail: "负号不匹配白名单正则 [0-9]+，因此未登录访问 /api/users/-1 会走登录校验（401）而非 404；已登录时路径变量能否绑定到 Long 需实测"
    ai_instruction: "先实测，不要凭直觉断言"

