    valid_range: "1~2"
    note: "**只有两个角色**。不要臆造 moderator / superadmin / guest 等不存在的角色。"
    api_writability: "**注册与改资料均不能设置 role**（DTO 不暴露），只能由数据库种子或直接改库产生"

  - "name: UserStatusEnum"
