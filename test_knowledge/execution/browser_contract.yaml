# 浏览器回归执行契约
#
# 用途：说明**哪些缺陷只能用真实浏览器测、怎么测、生成时要注意什么**。
#
# 为什么必须单独成文：
#   本项目存在一整类缺陷，**后端每次返回都是对的** ——
#   错在前端"筛选条件变了却没把新请求发出去"，导致**标签与数据不一致**。
#   pytest 打 HTTP 永远看不见这类问题（它直接调接口，不经过前端）。
#   所以这一层不能改用 pytest，也不能被"用 pytest 补一下"替代。
#
# 消费者：
#   LLM               → 判断某条用例该不该放在浏览器层；生成时必须按本文件的断言 ID 组织
#   CoverageValidator → 统计前端状态层的覆盖（唯一来源）
#   执行器            → 按本文件的启动步骤与退出码约定运行
#
# 真相来源：tests/browser_regression.mjs（333 行）｜tests/browser_check.mjs｜tests/README.md
# confidence: CONFIRMED
# verified_at: 2026-09-16（15 项断言全部 PASS）

meta:
  generated_at: 2026-09-17
  primary_script: tests/browser_regression.mjs
  secondary_script: tests/browser_check.mjs
  assertion_count: 15
  collected_by_pytest: false
  not_collected_reason: >-
    pytest.ini 的 testpaths=api，只收集 test_*.py；
    本脚本是 .mjs，因此**它红不会污染 pytest 的绿灯**。这是有意的隔离。

# ═══════════════════════════════════════════════════════════════
# 1. 什么时候必须用浏览器层
# ═══════════════════════════════════════════════════════════════
applicability:
  must_use_browser:
    - id: AB-01
      kind: 前端状态一致性
      symptom: "筛选条件（tab / keyword / type）变了，UI 标签变了，但列表数据还是旧的"
      root_cause: >-
        `if (loading.value) return` 这类 loading 守卫会丢弃**用户的新查询**，
        而不只是丢弃**过期响应**。正确写法是请求序号：只丢过期响应，不丢新查询。
      project_evidence: "2026-09-14 在 HomeView / SearchView / NotificationView 三处复现（BUG-002/003/004）"
      why_not_pytest: "后端每次返回都正确；缺陷在网络请求的**发出侧**"

    - id: AB-02
      kind: UI 降级行为
      symptom: "取不到的图片应降级为首字母占位，而不是留一枚永久破图"
      project_evidence: "BUG-006（UserAvatar.vue 缺 @error 兜底）"
      why_not_pytest: "jQuery 式的 <img> 解码失败是浏览器行为；HTTP 层看不出"

    - id: AB-03
      kind: 固定回归守卫
      symptom: "曾被怀疑有缺陷、实测证伪的行为，需要防止将来改坏"
      project_evidence: "BUG-001（取消关注后关注流是否残留 —— **本来就是对的**）"
      why_keep: "作为守卫保留：它证明这条链路是通的，改动时若挂掉会立刻暴露"

  cannot_use_browser:
    - "多用户并发浏览器会话同时操作 —— 当前脚本只做**单线程时序竞态**（靠人为延迟放大窗口），无多浏览器编排。属未验证缺口。"
    - "前端单元/组件测试 —— 项目未引入 Vitest / Jest，**有意取舍**（见 issues.yaml M-03）"
    - "登录/权限的接口契约 —— 那是 pytest 的职责"

  decision_rule: >-
    AI 判断标准只有一条：
    **「如果后端返回完全正确，这个问题还会发生吗？」**
    会 → 放浏览器层；不会 → 放 pytest 或 JUnit。
    注意：**不要**把浏览器层用例改写成 pytest —— 那会失去唯一能发现该缺陷的能力。

# ═══════════════════════════════════════════════════════════════
# 2. 运行环境（三个环境变量 + 一个 IPv6 坑）
# ═══════════════════════════════════════════════════════════════
environment:
  prerequisites:
    - "后端必须起着（默认 8081）"
    - "前端必须起着：cd frontend && npm run dev（默认 5173）"
    - "本机已装 Chrome（脚本用 channel: 'chrome'，**不需要** npx playwright install）"
  env_vars:
    - {name: MIQU_API_URL, default: "http://127.0.0.1:8081", desc: "被测后端地址"}
    - {name: MIQU_FRONT_URL, default: "http://localhost:5173", desc: "被测前端地址"}
    - name: MIQU_SLOW_MS
      default: 3000
      desc: "**人为放慢请求的毫秒数** —— 用来稳定复现「还在飞就点了下一个筛选条件」的窗口。宁可放大窗口，也不要靠运气复现竞态"
  run_command: |
    export NO_PROXY=localhost,127.0.0.1 no_proxy=localhost,127.0.0.1
    node tests/browser_regression.mjs
  ipv6_pitfall:
    critical: >-
      🔴 **前端必须用 `localhost`，不能用 `127.0.0.1`。**
      Vite 起在 5173 后**只监听 `::1`（IPv6）**，
      `curl http://127.0.0.1:5173` 返回 000，而 `http://localhost:5173` 正常。
      → 这就是为什么 MIQU_FRONT_URL 的默认值写的是 localhost，而 API 用的是 127.0.0.1。
  playwright_loading:
    mechanism: >-
      脚本用 createRequire 依次尝试 'playwright'、'D:/tools/playwright/'、'C:/tools/playwright/'。
      本机 playwright 装在 D:/tools/playwright/。
    launch: "chromium.launch({ channel: 'chrome', headless: true })"
    failure_code: "三个位置都加载不到 → 打印安装指引并 process.exit(2)"
  exit_codes:
    - {code: 0, meaning: "全部断言通过"}
    - {code: 1, meaning: "有断言失败"}
    - {code: 2, meaning: "环境不可用（playwright 加载失败 / 前后端未启动）"}
    - {code: 3, meaning: "脚本未捕获异常"}

# ═══════════════════════════════════════════════════════════════
# 3. 断言组织的约定（生成时必须遵守）
# ═══════════════════════════════════════════════════════════════
conventions:
  assertion_api:
    sig: "assert(id, title, ok, evidence)"
    behavior: "打印 'PASS/FAIL  [id] title'，并把结果累积到 results 数组；**不抛异常**（跑完所有断言再统一决定退出码）"
    evidence_param: "可选的补充信息字符串（如实测到的 tab 名、请求 URL 列表），失败时用于定位"
  id_scheme:
    pattern: "<BUG编号>.<字母序号>"
    examples: ["BUG-001.a", "BUG-002.b", "BUG-006.c"]
    rationale: >-
      与 test_cases/*.yaml 的 `browser` 字段对齐：
      test_cases 用 `browser: BUG-002.a` 指向本脚本的断言 ID（而 **不是** pytest 的"文件::函数名"）。
      → 生成新断言时必须沿用一个已有前缀，或在 issues.yaml 登记新前缀。
  group_pattern:
    desc: "每个缺陷一组，组内按 setup → 触发 → 断言 的顺序"
    typical_group:
      - "console.log 组标题"
      - "API 造前置数据（用 api() 辅助函数直接打后端，不走 UI）"
      - "page.goto / 点击 / 输入"
      - "若干 assert(...)"
  api_helper: "脚本内自带 api(method, path, {token, body}) 辅助函数，用 fetch 直连后端造数据 —— **不经过 UI**"

