# ═══════════════════════════════════════════════════════════════
# AUTH 域 —— 认证（test_cases 中**未登记**，本文件首次结构化）
# ═══════════════════════════════════════════════════════════════
auth_rules:
  domain: AUTH
  registered_in_test_cases: false
  gap_note: "test_cases/*.yaml 中无任何 AUTH- 条目；这些规则目前只由 tests/api/test_auth.py 与 AuthControllerTest.java 覆盖"

  rules:
    - id: AUTH-001
      description: 注册时用户名已占用 → 409
      given: {username_exists: true}
      when: {action: "POST /api/auth/register，username 与已有用户相同"}
      then:
        success: false
        code: 409
        error_code: USERNAME_EXISTS
        message: 用户名已被占用
      preconditions: ["库中已有同名用户（可用种子 test001，或先注册一个）"]
      related_api: POST_AUTH_REGISTER
      related_entities: [user]
      related_fields: [RegisterRequest.username]
      evidence: {source: "AuthServiceImpl.java:47-49", confidence: CONFIRMED}
      db_fallback: "并发注册同名时由 uk_username 兜底，同样映射为 409 USERNAME_EXISTS"

    - id: AUTH-002
      description: 注册时邮箱已注册 → 409
      given: {email_exists: true}
      when: {action: "POST /api/auth/register，email 与已有用户相同（username 不同）"}
      then: {success: false, code: 409, error_code: EMAIL_EXISTS, message: 邮箱已被注册}
      preconditions: ["库中已有同邮箱用户"]
      related_api: POST_AUTH_REGISTER
      related_entities: [user]
      evidence: {source: "AuthServiceImpl.java:50-52", confidence: CONFIRMED}
      test_note: "必须让 username 不同、只让 email 相同，否则先命中 AUTH-001"
      db_fallback: "uk_email 兜底"

    - id: AUTH-003
      description: 登录凭证错误 → 401（用户名不存在与密码错误**故意不可区分**）
      # ⚠️ 2026-09-17 修正：原写作 `{username_exists: false, or: password_wrong: true}`，
      #    其中 `or` 作为**流式映射的键**会让 PyYAML 6.0.3 直接解析失败
      #    （`and` / `not` 不会；而 `on` 会被静默解析成布尔 True —— 都是同一类坑）。
      #    改成 any_of 列表后语义更明确，也不再依赖解析器的怪癖。
      given:
        any_of:
          - {username_exists: false}
          - {password_wrong: true}
      when: {action: "POST /api/auth/login"}
      then: {success: false, code: 401, error_code: INVALID_CREDENTIALS, message: 用户名或密码错误}
      related_api: POST_AUTH_LOGIN
      evidence: {source: "AuthServiceImpl.java:83-86", confidence: CONFIRMED}
      security_design: >-
        两种情况返回**完全相同**的 code 与 message，防止账号枚举。
        → 不要生成"用户名不存在应返回 404 USER_NOT_FOUND"的用例，那是错的。
      source_comment: "AuthServiceImpl.java:82 有注释说明此设计意图"

    - id: AUTH-004
      description: 登录被禁用账号 → 423
      given: {user_status: 0, password_correct: true}
      when: {action: "POST /api/auth/login"}
      then: {success: false, code: 423, error_code: USER_DISABLED, message: "账号已被禁用，请联系管理员"}
      preconditions: ["可用种子账号 banned001(id=12)，密码 123456"]
      related_api: POST_AUTH_LOGIN
      evidence: {source: "AuthServiceImpl.java:87-89", confidence: CONFIRMED}
      note_423: "本项目用 **423**，不是 403。这是自定义语义。"

    - id: AUTH-005
      description: 登录校验顺序 —— 密码校验**先于**状态校验
      given: {user_status: 0, password_correct: false}
      when: {action: "POST /api/auth/login（被禁用账号 + 错误密码）"}
      then: {success: false, code: 401, error_code: INVALID_CREDENTIALS, message: 用户名或密码错误}
      not_expected: {code: 423, why: "状态校验在密码校验之后，走不到"}
      related_api: POST_AUTH_LOGIN
      evidence: {source: "AuthServiceImpl.java:83-86（先 matches 再 isNormal）", confidence: CONFIRMED}
      why_it_matters: >-
        这是"叠加违规"类规则：一个请求同时满足两个失败条件时，预期码取决于**代码顺序**。
        AI 若按直觉认为"禁用账号就该 423"，会生成错误断言。
      security_design: "不暴露'此账号存在且被禁用'这一信息"
      cross_ref: rules/validation_order.yaml → LOGIN

    - id: AUTH-006
      description: 新注册用户的默认属性
      given: {action_succeeds: true}
      when: {action: "POST /api/auth/register 成功"}
      then:
        success: true
        code: 200
        data_assertions:
          - {field: role, expected: 1, meaning: USER}
          - {field: status, expected: 1, meaning: NORMAL}
          - {field: followingCount, expected: 0}
          - {field: followerCount, expected: 0}
          - {field: postCount, expected: 0}
          - {field: password, expected: "**不出现在响应中**"}
          - {field: id, expected: "**字符串类型**（SER-01）"}
      side_effects: ["仅插入 user 行；**不产生通知、不产生关注、不产生动态**"]
      related_api: POST_AUTH_REGISTER
      related_entities: [user]
      evidence: {source: "AuthServiceImpl.java:63-67", confidence: CONFIRMED}

    - id: AUTH-007
      description: 退出登录**不会**使已签发的 Token 失效
      given: {logged_in: true}
      when: {action: "POST /api/auth/logout，然后用同一 Token 访问 GET /api/users/me"}
      then:
        logout_code: 200
        subsequent_request_code: 200
        note: "**旧 Token 在 7 天有效期内仍然可用**"
      related_api: POST_AUTH_LOGOUT
      evidence:
        source: "AuthController.java:66-80（logout 只记 log.info，无任何服务端状态变更）"
        confidence: CONFIRMED
        corroborated_by: >-
          AuthController 的 @Operation description 明确写着：
          "本系统使用无状态 JWT，服务端不维护会话，因此退出登录由**客户端丢弃 Token** 完成。
           该接口仅用于记录审计日志。已知限制：已签发的 Token 在有效期内仍然可用。
           若需要服务端强制失效，需引入 Redis 黑名单或改用短期 access token + refresh token。"
      why_it_matters: >-
        ⚠️ **这是 AI 最容易猜错的规则之一**。绝大多数系统的 logout 会使会话失效，
        AI 会本能地生成"登出后旧 Token 应返回 401"的用例 —— 在本项目这是**错误断言**（实际 200）。
      the_only_ways_to_invalidate_token:
        - "管理员禁用账号 → 423（每请求查库，立即生效）"
        - "用户被逻辑删除 → 401（每请求查库，立即生效）"
        - "等待 7 天自然过期"
      related_rules: [SEC-002]

    - id: AUTH-008
      description: JWT 每请求查库，禁用后旧 Token 立即失效
      given: {logged_in: true, then_disabled_by_admin: true}
      when: {action: "用禁用前签发的 Token 访问任一受保护接口"}
      then: {success: false, code: 423, error_code: USER_DISABLED}
      related_api: "全部受保护端点"
      evidence: {source: "JwtAuthenticationFilter.java:68-69", confidence: CONFIRMED}
      why_it_matters: >-
        如果只验签不查库，被禁用用户拿着旧 Token 在 7 天内都能继续访问。
        这是 SEC-002 的实现基础。
      test_cleanup: "用例必须在 finally 中把 status 恢复为 1，否则留下禁用账号"
      existing_test: "tests/api/test_auth.py:140-161 test_me_returns_403_after_account_disabled"
      naming_note: >-
        ⚠️ 已有测试函数名是 `test_me_returns_403_after_account_disabled`，
        但实际断言的是 **423**（函数名里的 403 是历史遗留的命名不准确）。
        → 引用此用例时以**实际断言 423** 为准，不要被函数名误导。见 issues.yaml I-03。
      related_rules: [SEC-002, AUTH-004]

# ═══════════════════════════════════════════════════════════════
# USER 域 —— 用户资料与账号（test_cases 中**未登记**）
# ═══════════════════════════════════════════════════════════════
user_rules:
  domain: USER
  registered_in_test_cases: false
  gap_note: "test_cases/*.yaml 中无任何 USER- 条目"

  rules:
    - id: USER-001
      description: 修改资料只允许白名单字段（批量赋值防护）
      given: {logged_in: true}
      when: {action: "PUT /api/users/me，请求体额外携带 username / email / role / status"}
      then:
        success: true
        code: 200
        assertions:
          - "nickname / gender / birthday / bio 按请求修改"
          - "username **未变**"
          - "email **未变**"
          - "role **未变**（仍为 1）"
          - "status **未变**（仍为 1）"
      related_api: PUT_USERS_ME
      related_entities: [user]
      evidence:
        source: "UpdateProfileRequest 是 record 类型，只声明 nickname/gender/birthday/bio 四个字段"
        confidence: CONFIRMED
      mechanism: "Jackson 配置忽略未知字段（SER-06），多传的字段被静默丢弃，**不报错**"
      assertion_warning: >-
        ⚠️ 断言应是"字段未被修改"，**不是**"返回 400"。
        AI 容易生成"多传 role 应被拒绝(400)"的错误用例。
      existing_cases: [SEC-003]
      priority: P0

    - id: USER-002
      description: 修改密码 —— 原密码不正确 → 400
      given: {logged_in: true, old_password_wrong: true}
      when: {action: "PUT /api/users/me/password"}
      then: {success: false, code: 400, error_code: OLD_PASSWORD_MISMATCH, message: 原密码不正确}
      related_api: PUT_USERS_ME_PASSWORD
      evidence: {source: "UserServiceImpl.java:74-76", confidence: CONFIRMED}
      test_data_warning: "**必须用 fresh_user**，种子账号密码改了无法恢复（无重置密码接口）"

    - id: USER-003
      description: 修改密码 —— 新密码与原密码相同 → 400
      given: {logged_in: true, old_password_correct: true, new_equals_old: true}
      when: {action: "PUT /api/users/me/password"}
      then: {success: false, code: 400, error_code: PASSWORD_SAME_AS_OLD, message: 新密码不能与原密码相同}
      related_api: PUT_USERS_ME_PASSWORD
      evidence: {source: "UserServiceImpl.java:77-79", confidence: CONFIRMED}
      check_order: "在 OLD_PASSWORD_MISMATCH 之后（原密码必须先对）"
      side_effect_note: "**改密码不会使已签发 Token 失效**（JWT 无状态，同 AUTH-007）"

    - id: USER-004
      description: 头像 URL 必须以 /uploads/ 开头
      given: {logged_in: true}
      when: {action: "PUT /api/users/me/avatar，avatar 为外部链接"}
      then: {success: false, code: 400, error_code: INVALID_IMAGE_URL,
             message: "图片地址不合法，请先通过上传接口获取"}
      related_api: PUT_USERS_ME_AVATAR
      evidence: {source: "UserServiceImpl.java:101-104", confidence: CONFIRMED}
      security_reason: >-
        源码注释写明：否则用户可把头像指向任意外链（追踪像素、违规图），
        服务器既成了别人的图床，内容审核也无从下手。
      doc_conflict:
        doc_claim: "docs/api/users.md:290-291,335 称**不校验前缀**，'不要写外链 400 的断言'"
        code_reality: "**明确校验**，外链返回 400"
        verdict: "**以代码为准**。文档是 BUG-005（2026-09-14 修复）之前的旧描述"
        severity: P0
        issue_ref: issues.yaml C-01
      existing_cases: [SEC-011]
      frozen: true
      priority: P0

    - id: USER-005
      description: 头像前缀校验带尾部斜杠，近似串被拒
      given: {logged_in: true}
      when: {action: 'PUT /api/users/me/avatar，avatar = "/uploads-evil/x.png"'}
      then: {success: false, code: 400, error_code: INVALID_IMAGE_URL}
      related_api: PUT_USERS_ME_AVATAR
      evidence:
        source: "UserServiceImpl.java:100-101（prefix = urlPrefix + 「/」，源码注释明确提到此绕过手法）"
        confidence: CONFIRMED
      bypass_attempts_that_fail:
        - "/uploads-evil/x.png"
        - "/uploadsx/y.png"
        - "uploads/z.png（缺前导斜杠）"
      trimmed_before_check: "avatar 会先 trim()，故 '  /uploads/x.png  ' **能通过**"
      related_rules: [USER-004, POST-003]

    - id: USER-006
      description: 搜索关键词的 LIKE 通配符被转义
      given: {any_state: true}
      when: {action: "GET /api/users/search?keyword=%"}
      then:
        success: true
        code: 200
        assertion: "**不会匹配全表**；% 被当作字面字符"
      related_api: GET_USERS_SEARCH
      evidence: {source: "UserServiceImpl.java:182 + common/SqlLikeUtils.java", confidence: CONFIRMED}
      also_applies_to: ["keyword=_（单字符通配符）"]
      existing_cases: [SEC-006]
      frozen: true
      priority: P0

    - id: USER-007
      description: 搜索关键词为空 → 400
      given: {any_state: true}
      when: {action: "GET /api/users/search?keyword=（空串）"}
      then: {success: false, code: 400, error_code: PARAM_INVALID, message: 搜索关键词不能为空}
      related_api: GET_USERS_SEARCH
      evidence:
        source: "UserSearchQuery @NotBlank + UserServiceImpl.java:176-178（Service 层二次校验，通常不可达）"
        confidence: CONFIRMED
      note: "DTO 校验先命中，Service 的同名分支不可达，但**文案字面相同**，断言安全"

    - id: USER-008
      description: requireActiveUser 闸门 —— userId 为 null → 401
      given: {current_user_id: null}
      when: {action: "调用任何使用 requireActiveUser 的受保护操作"}
      then: {success: false, code: 401, error_code: UNAUTHORIZED}
      evidence: {source: "UserServiceImpl.java:117-119", confidence: CONFIRMED}
      note: "正常流程下 AuthInterceptor 已先拦，此分支是纵深防御"

    - id: USER-009
      description: requireActiveUser 闸门 —— 用户已逻辑删除 → 404
      given: {user_deleted: true}
      when: {action: "调用 requireActiveUser"}
      then: {success: false, code: 404, error_code: USER_NOT_FOUND, message: 用户不存在}
      evidence: {source: "UserServiceImpl.java:121-124", confidence: CONFIRMED}
      mechanism: "@TableLogic 自动加 deleted=0，查不到即视为不存在"
      test_data: "可用种子账号 deleted001(id=13)"

    - id: USER-010
      description: requireActiveUser 闸门 —— 用户被禁用 → 423
      given: {user_status: 0}
      when: {action: "调用 requireActiveUser"}
      then: {success: false, code: 423, error_code: USER_DISABLED}
      evidence: {source: "UserServiceImpl.java:125-127", confidence: CONFIRMED}
      affects_apis: ["发帖", "评论", "点赞", "关注", "发私信", "开会话", "举报", "改资料", "改密码", "改头像", "上传"]
      test_data: "可用种子账号 banned001(id=12)"

    - id: USER-011
      description: requireVisibleUser —— **禁用用户仍可被查看**
      given: {user_status: 0}
      when: {action: "GET /api/users/{id}（查看禁用用户主页）"}
      then: {success: true, code: 200, note: "正常返回 UserProfileVO"}
      related_api: GET_USERS_ID
      evidence: {source: "UserServiceImpl.java:132-142（只查存在性，不检查 status）", confidence: CONFIRMED}
      contrast_with: "requireActiveUser（USER-010）会拒绝禁用用户"
      why_it_matters: >-
        ⚠️ 反直觉：禁用用户**不能操作**但**能被看到**。
        AI 容易生成"禁用用户主页应返回 423"的错误用例。
      also_applies_to: ["GET /api/users/search（搜索结果**包含**禁用用户）", "管理端查看用户"]
      excludes_deleted: "已逻辑删除的用户仍返回 404（@TableLogic 过滤）"

    - id: USER-012
      description: 管理员不能对自己执行禁用/解禁
      given: {admin_id: X, target_user_id: X}
      when: {action: "PUT /api/admin/users/{X}/status"}
      then: {success: false, code: 400, error_code: CANNOT_OPERATE_SELF, message: 不能对自己执行该操作}
      related_api: PUT_ADMIN_USERS_ID_STATUS
      evidence: {source: "UserServiceImpl.java:217-219", confidence: CONFIRMED}

    - id: USER-013
      description: 管理员不能禁用另一个管理员
      given: {admin_id: X, target_user_role: 2}
      when: {action: "PUT /api/admin/users/{target}/status，body status=0"}
      then: {success: false, code: 403, error_code: CANNOT_DISABLE_ADMIN, message: 不能禁用管理员账号}
      related_api: PUT_ADMIN_USERS_ID_STATUS
      evidence: {source: "UserServiceImpl.java:223-225", confidence: CONFIRMED}
      unreachable_via_http: true
      unreachable_reason: >-
        种子数据**只有 1 个管理员**（admin, id=1）。
        管理员禁用自己 → USER-012 的 400 先命中；
        要触发本规则需要"管理员 A 禁用管理员 B"，但种子没有第二个管理员。
        → **HTTP 层无输入可触达**。
      existing_cases: ["SEC-004（status: gap）"]
      gap_reason_from_test_cases: "校验顺序中'不能操作自己'先命中，种子只有一个管理员，HTTP 层无输入可触达"
      to_cover: "补第二个管理员种子账号，或写直接改库的集成测试"
      issue_ref: issues.yaml M-01
      ai_instruction: >-
        ⚠️ **不要生成这条规则的 HTTP 用例**——它无法通过 API 触达，生成的用例必然失败或假通过。
        若要覆盖，只能建议"新增种子账号"或"写集成测试"，这属于**需人工决策的改动**。

    - id: USER-014
      description: 账号状态校验顺序 —— 不能操作自己(400) **先于** 目标是管理员(403)
      given: {admin_id: X, target_user_id: X, target_user_role: 2}
      when: {action: "PUT /api/admin/users/{X}/status（管理员禁用自己）"}
      then: {success: false, code: 400, error_code: CANNOT_OPERATE_SELF}
      not_expected: {code: 403, why: "CANNOT_DISABLE_ADMIN 的校验在后面，走不到"}
      related_api: PUT_ADMIN_USERS_ID_STATUS
      evidence: {source: "UserServiceImpl.java:217-225（先 equals 再 isAdmin）", confidence: CONFIRMED}
      cross_ref: rules/validation_order.yaml → ADMIN_UPDATE_STATUS
      consequence: "这条顺序依赖正是 USER-013 不可达的根因"

# ═══════════════════════════════════════════════════════════════
# POST 域 —— 动态（test_cases 中**未登记**）
# ═══════════════════════════════════════════════════════════════
post_rules:
  domain: POST
  registered_in_test_cases: false
  gap_note: "test_cases/*.yaml 中无任何 POST- 条目（LIKE 域已登记 4 条）"

  rules:
    - id: POST-001
      description: 动态内容与图片不能同时为空
      given: {logged_in: true, content_empty: true, images_empty: true}
      when: {action: "POST /api/posts"}
      then: {success: false, code: 400, error_code: EMPTY_POST, message: 动态内容与图片不能同时为空}
      related_api: POST_POSTS
      related_fields: [PostCreateRequest.content, PostCreateRequest.images]
      evidence: {source: "PostServiceImpl.java:70-72", confidence: CONFIRMED}
      cross_field_rule: true
      triggering_combinations:
        - {content: null, images: null, expect: 400}
        - {content: '""', images: '[]', expect: 400}
        - {content: '""', images: null, expect: 400}
        - {content: null, images: '[]', expect: 400}
        - {content: '["   "]（纯空白）', images: '[]', expect: 400, confidence: INFERRED,
           note: "Service 是否 trim 后判空未逐字确认，建议实测"}
      non_triggering:
        - {content: '"hi"', images: '[]', expect: 200}
        - {content: '""', images: '["/uploads/a.jpg"]', expect: 200}
      dto_note: >-
        ⚠️ content **无 @NotBlank**（只有 @Size），所以空串/null 能通过 DTO 校验，
        由 Service 的跨字段规则拦截。不要断言 message 为"动态内容不能为空"（无此文案）。

    - id: POST-002
      description: 单条动态最多 9 张图片
      given: {logged_in: true, images_count: 10}
      when: {action: "POST /api/posts"}
      then: {success: false, code: 400, message: 最多只能上传 9 张图片}
      related_api: POST_POSTS
      evidence: {source: "PostCreateRequest @Size(max=9) + PostServiceImpl.java:73-75 + BizConstants.MAX_POST_IMAGES=9",
                 confidence: CONFIRMED}
      boundary: {max_ok: 9, min_fail: 10}
      corroboration: "种子 post id=1 恰好 9 张图（data.sql 有意设计的上界样本）"
      attribution_note: >-
        ⚠️ DTO 的 @Size 会**先**拦为 PARAM_INVALID(400)，Service 的 TOO_MANY_IMAGES 分支通常不可达。
        但两者 message **字面相同**，所以断言 code=400 + 该文案是安全的；
        只是规则溯源应写 PARAM_INVALID / PostCreateRequest，不要声称触发了 TOO_MANY_IMAGES。
      empty_string_elements_filtered: 'images 中的空串元素会被 trim 后过滤，故 ["a",""] 实际算 1 张'

    - id: POST-003
      description: 动态图片 URL 必须以 /uploads/ 开头
      given: {logged_in: true}
      when: {action: 'POST /api/posts，images 含 "https://evil.com/a.jpg"'}
      then: {success: false, code: 400, error_code: INVALID_IMAGE_URL,
             message: "图片地址不合法，请先通过上传接口获取"}
      related_api: POST_POSTS
      evidence: {source: "PostServiceImpl.java:318-325", confidence: CONFIRMED}
      existing_cases: [SEC-007]
      frozen: true
      priority: P0
      shares_error_code_with: USER-004（头像）
      correct_workflow: "先 POST /api/files/image 拿到 url，再把该 url 放进 images"

    - id: POST-004
      description: 非作者且非管理员不能删除动态 → 403
      given: {logged_in_as: B, post_author: A, b_is_admin: false}
      when: {action: "DELETE /api/posts/{id}"}
      then: {success: false, code: 403, error_code: FORBIDDEN, message: 无权限执行该操作}
      related_api: DELETE_POSTS_ID
      evidence: {source: "PostServiceImpl.java:106-109", confidence: CONFIRMED}
      existing_cases: [SEC-009]
      frozen: true
      priority: P0
      check_order: "先查 post 是否存在（404），再判权限（403）"
      test_note: "用 fresh_user 建动态再让另一个 fresh_user 删，**不要删种子动态**"

    - id: POST-005
      description: 管理员可删除他人动态
      given: {logged_in_as: admin, post_author: A}
      when: {action: "DELETE /api/posts/{id}"}
      then: {success: true, code: 200}
      related_api: DELETE_POSTS_ID
      evidence: {source: "PostServiceImpl.java:107（CurrentUserHolder.isAdmin()）", confidence: CONFIRMED}
      side_effects_ref: rules/side_effects.yaml → DELETE_POST

    - id: POST-006
      description: tab=following 未登录 → 401（同端点的条件认证）
      given: {logged_in: false}
      when: {action: "GET /api/posts?tab=following"}
      then: {success: false, code: 401, error_code: UNAUTHORIZED}
      related_api: GET_POSTS
      evidence: {source: "PostServiceImpl.java:135-137", confidence: CONFIRMED}
      why_it_matters: >-
        ⚠️ GET /api/posts **在免登录白名单里**，但 tab=following 时由 **Service 层**拦 401。
        这是全项目唯一的"认证要求随查询参数变化"的端点。
        AI 若只看白名单会漏掉这条用例。
      contrast: {tab: latest, expect: "200（未登录可访问）"}

    - id: POST-007
      description: 删除动态的级联副作用
      given: {post_has_comments: true, post_has_likes: true, post_has_images: true, post_has_notifications: true}
      when: {action: "DELETE /api/posts/{id}（作者或管理员）"}
      then:
        success: true
        code: 200
        db_assertions:
          - "post.deleted = 1（逻辑删除）"
          - "该动态下全部 comment.deleted = 1（**逻辑删除**）"
          - "post_image 行被**物理删除**"
          - "post_like 行被**物理删除**"
          - "user.post_count 减 1"
          - "type=2(点赞)/type=3(评论) 且 post_id 匹配的 notification 被**物理删除**"
      related_api: DELETE_POSTS_ID
      evidence: {source: "PostServiceImpl.java:112-122", confidence: CONFIRMED}
      cross_ref: rules/side_effects.yaml → DELETE_POST
      soft_vs_physical_warning: >-
        ⚠️ 同一操作里**混用**逻辑删除与物理删除。
        直接 SQL 断言时：comment 要带 deleted=1 条件查；post_image/post_like/notification 是行已消失。

