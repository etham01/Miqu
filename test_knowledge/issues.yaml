# 问题清单 —— UNKNOWN / INFERRED / CONFLICT / MISSING
#
# 用途：**不隐藏问题**。这是整套知识库诚实性的落点。
#
# 为什么必须单独成文：
#   前 15 个文件都在陈述"事实是什么"。但真实项目里总有：
#     · 文档与代码不一致（CONFLICT）
#     · 只能推断不能确认（INFERRED）
#     · 压根查不出来（UNKNOWN）
#     · 知道该测但没测（MISSING）
#   如果不集中登记，AI 就会在生成时**自行选一个版本**当作事实 —— 这正是要避免的。
#
# 消费者：
#   LLM               → 🔴 **禁止把 UNKNOWN/INFERRED 当事实断言**；命中 CONFLICT 时以 code_reality 为准
#   BusinessValidator → CONFLICT 项是拦截规则
#   CoverageValidator → MISSING 项即"待覆盖清单"
#
# 真相来源：抽取过程与实测（见各项 evidence）
# confidence: CONFIRMED（本文件记录的都是"已确认存在的问题"）
# verified_at: 2026-09-17

meta:
  generated_at: 2026-09-17
  categories:
    CONFLICT: "两个来源说法不一致 —— **以代码/实测为准**，并把另一方登记为滞后"
    INFERRED: "由代码逻辑推断但未实测 —— 使用前须实测"
    UNKNOWN: "无法确认 —— **禁止当作事实**"
    MISSING: "已知该测但没测/不可达 —— 覆盖缺口"
  handling_rules:
    - "CONFLICT：断言依据 = code_reality（代码实际），**不得**用 doc_claim"
    - "INFERRED：先探针实测，实测后升级为 CONFIRMED 并更新知识库"
    - "UNKNOWN：不生成依赖它的用例；要么取证，要么跳过"
    - "MISSING：可作为「待补覆盖」目标；标 unreachable 的不计入分母"
  counts:
    conflict: 6
    inferred: 4
    unknown: 4
    missing: 9

