# JUnit / MockMvc 执行契约
#
# 用途：让 AI 生成的后端进程内用例**可直接编译运行**。
#
# 与 pytest 契约的关键差异（决定你该选哪一套）：
#   JUnit：进程内、**事务自动回滚**、不发真实 HTTP → 适合"规则密集的分支覆盖"。
#   pytest：真实 HTTP + 真实落库 → 适合"端到端契约与序列化"。
#   两者**都依赖真实的 MySQL 与种子数据**（项目不用 H2、不用 Testcontainers）。
#
# 消费者：LLM（生成代码）｜Pydantic（校验类名与方法名）｜执行器（直接运行）
#
# 真相来源（逐行读取）：
#   backend/src/test/java/com/miqu/support/BaseControllerTest.java
#   backend/src/test/java/com/miqu/**/*Test.java（21 个测试类）
#   backend/pom.xml（依赖与插件）
#   docs/api/README.md §11.4（分工表）
#
# confidence: CONFIRMED
# verified_at: 2026-09-17

meta:
  generated_at: 2026-09-17
  location: backend/src/test/java/com/miqu/
  suite_size: 291
  class_count: 21
  framework: "JUnit 5（版本由 spring-boot-starter-test 管理）+ MockMvc + AssertJ"
  no_h2: "❌ 未使用 H2 内存库 —— **也连真实 MySQL**"
  no_testcontainers: "❌ 未使用 Testcontainers"
  no_ci: "❌ 无 CI 配置（扫描确认不存在 .github/workflows / Jenkinsfile / Dockerfile）"

# ═══════════════════════════════════════════════════════════════
# 1. 运行环境与前置（这一步不做，用例会大面积红）
# ═══════════════════════════════════════════════════════════════
environment:
  critical_prerequisite:
    rule: "🔴 跑 mvn test 前**必须先重置数据库**"
    why: >-
      JUnit 大量使用**种子数据的绝对值断言**（如 post 1 有 9 张图、test001 粉丝 14）。
      手工 curl 或前端操作过之后这些值会漂移，用例就会红 —— 这不是代码问题。
    command: |
      mysql -u root -p < database/schema.sql
      mysql -u root -p < database/data.sql
    correct_order: "重置库 → mvn test → 再重置库 → 启后端 → pytest → 浏览器回归"

  mvn_wrapper:
    problem: "mvn 命令本身不可用，报 ClassNotFoundException: org.codehaus.plexus.classworlds.launcher.Launcher"
    workaround: "用包装脚本：bash .workbuddy/tools/mvn.sh test"
    requires: "JAVA_HOME=D:/soft/java/Java/jdk-21（系统 PATH 里的 java 是 25，JUnit 跑不起来）"

  jar_lock_pitfall:
    symptom: "mvn package 报 Unable to rename '...miqu-backend-1.0.0.jar' to '...jar.original'"
    cause: "运行中的后端进程锁着那个 jar。**编译是成功的，只有 repackage 失败。**"
    fix: "先停掉 8081 的 java 进程再打包"
    implication: "mvn test 期间后端必须停着 —— 否则它自己也依赖编译产物，且会锁 jar"

  server_port_pitfall:
    symptom: "用 java -jar 启动后端时抢不到端口 / 起不来"
    cause: "沙箱会注入 SERVER__PORT=16605，Spring Boot 宽松绑定把它当 server.port"
    fix: "env -u SERVER__PORT -u SERVER_PORT $JAVA_HOME/bin/java -jar ... --server.port=8081"

  run_commands:
    all: "bash .workbuddy/tools/mvn.sh test"
    single_class: "bash .workbuddy/tools/mvn.sh test -Dtest=UserControllerTest"
    report: "backend/target/surefire-reports/"

# ═══════════════════════════════════════════════════════════════
# 2. 事务语义（JUnit 与 pytest 最本质的区别）
# ═══════════════════════════════════════════════════════════════
transaction_semantics:
  annotation: "@Transactional（在 BaseControllerTest 类上）"
  effect: "每个用例结束后**自动回滚**，用例之间不互相污染，也不需要手工清理"
  why_it_works: >-
    MockMvc **不发真实 HTTP 请求**，被测代码运行在与测试方法**相同的线程和事务**中
    （BaseControllerTest.java 的类注释原文说明了这一点）。
  caveats:
    - "⚠️ 若将来改用真实端口，事务就不再共享，`@Transactional` 回滚会失效 —— 必须换成显式清理"
    - "因为会回滚，JUnit 里**可以**自由使用种子账号做写操作（这是 JUnit 的特权，pytest 没有）"
    - "⚠️ 但**不要改种子账号的密码**：BCrypt 写入后即使回滚，若测试在事务外有副作用（如日志）仍可能留下痕迹，且习惯不好"
  implication_for_ai: >-
    ✅ 需要"改数据但不污染环境"的用例优先用 JUnit —— 它天然隔离。
    需要"验证真实提交后的可见性/序列化/过滤器链"的用例用 pytest。

# ═══════════════════════════════════════════════════════════════
# 3. 基类 API（只能用这些）
# ═══════════════════════════════════════════════════════════════
base_class:
  fqcn: com.miqu.support.BaseControllerTest
  annotations: ["@SpringBootTest", "@AutoConfigureMockMvc", "@Transactional"]
  inherits: "所有 Controller 测试类都继承它（不要自己 new MockMvc）"
  provided:
    - {name: mockMvc, type: MockMvc, injection: "@Autowired protected", desc: "执行请求"}
    - {name: objectMapper, type: ObjectMapper, injection: "@Autowired protected"}
    - {name: LOGIN_URL, type: "static final String", value: "/api/auth/login"}
    - {sig: "exec(MockHttpServletRequestBuilder builder) -> JsonNode", desc: "执行请求并解析统一响应体；**响应体为空会抛 AssertionError 并带上 HTTP 状态码**"}
    - {sig: "login(String username, String password) -> String", desc: "用种子账号登录并返回 token；拿不到 token 会抛 AssertionError"}
    - {sig: "bearer(String token) -> String", desc: "拼成 'Bearer <token>'"}
  typical_autowire:
    - field: "JwtTokenProvider jwtTokenProvider"
      use: "**自己签发 Token**，用于构造「禁用前的旧 Token」这类无法通过登录拿到的场景"

# ═══════════════════════════════════════════════════════════════
# 4. 断言范式（两条铁律）
# ═══════════════════════════════════════════════════════════════
assertion_style:
  rule_1_http_is_always_200:
    wrong: ".andExpect(status().isForbidden())"
    right: ".andExpect(status().isOk()).andExpect(jsonPath(\"$.code\").value(403))"
    why: "GlobalExceptionHandler 所有分支都返回 HTTP 200，业务结果只看 body.code（XC-001）"
    note: "本项目的 JUnit 一律写 status().isOk()，这是**故意**的，不是笔误"
  rule_2_message_is_assertable:
    right: ".andExpect(jsonPath(\"$.message\").value(\"需要互相关注后才能私聊\"))"
    caveat: >-
      ⚠️ message 可断言的场景见 api/error_codes.yaml 的 `message_assertable` 字段。
      PARAM_INVALID / FORBIDDEN / INTERNAL_ERROR 这几个被复用或被覆盖文案，
      **不要**断它们的默认文案。
  two_styles_coexist:
    - "MockMvc 的 jsonPath（主流）"
    - "AssertJ 的 assertThat（取到 JsonNode 后再断言，用于复杂结构）"

