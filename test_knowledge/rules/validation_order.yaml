# ═══════════════════════════════════════════════════════════════
# 5. 对 api/endpoints.yaml 的顺序性修正记录（2026-09-17）
# ═══════════════════════════════════════════════════════════════
#
# 抽取本文件时发现 endpoints.yaml 有 4 处顺序/性质描述不准确，已就地修正。
# 记录在此以便追溯"为什么改了"。
corrections_applied:
  - id: F-01
    target: api/endpoints.yaml → PUT_USERS_ME_AVATAR.error_check_order
    was: '["1. requireActiveUser(401/404/423)", "2. Bean Validation(400)", "3. 前缀校验(400)"]'
    now: "改为 layer 2（拦截器 401/423）→ layer 3（Bean Validation 400）→ layer 4（前缀校验 400）"
    why: >-
      原写法把拦截器给出的 423 归因成 requireActiveUser，并把 423 排在 400 之前，
      会让人误以为"Service 先于 Bean Validation"。实测（P1/P3/P4）：
      **活跃用户 + 空 avatar → 400**，证明 Bean Validation 先于 Service；
      禁用用户的 423 来自拦截器（更早的一层）。结论码巧合相同，但机制与顺序都不同。
    evidence: validation_order_probe P1/P3/P4

  - id: F-02
    target: api/endpoints.yaml → PUT_ADMIN_USERS_ID_STATUS.error_check_order
    was: "只写了 3 步，缺 Bean Validation"
    now: "补为 0. Bean Validation(status∈{0,1}) → 1. 不能操作自己 → 2. 目标存在 → 3. 目标是管理员"
    why: 'status=9 + target=self 实测返回 400 PARAM_INVALID，而非 CANNOT_OPERATE_SELF'
    evidence: validation_order_probe P11

  - id: F-03
    target: api/endpoints.yaml → DELETE_POSTS_ID.side_effects
    was: '**物理删除** type=2(点赞)/type=3(评论) 且 post_id 匹配的 notification'
    now: "**逻辑删除**（Notification extends BaseEntity，Mapper.delete 实为 UPDATE deleted=1）"
    why: >-
      写错会让 AI 生成"查库断言该行已消失"的 SQL 断言，而实际该行仍在且 deleted=1。
    evidence: >-
      Notification.java:18 `extends BaseEntity`；BaseEntity.java:42 `@TableLogic`；
      2026-09-17 实测：取消关注后 SELECT ... FROM notification WHERE user_id=26 AND actor_id=25 AND type=1
      → 返回 (id=38, deleted=1)，行**存在**。
    contrast: "同一操作里的 follow 行则是**物理删除**（实测 count=0），两者不同，勿混"

  - id: F-04
    target: api/endpoints.yaml → PUT_ADMIN_REPORTS_ID_HANDLE.related_rules
    was: "[SRCH-004, SRCH-005, SRCH-006, SRCH-007, SRCH-008]"
    now: "[RPT-004, RPT-005, RPT-006, RPT-007, RPT-008]"
    why: >-
      原引用明显是复制粘贴错误：SRCH 是**搜索**域（对应 test_search.py），且
      business_rules.yaml 中**不存在任何 SRCH-* 规则**，属悬空引用。
      举报处置的规则在 business_rules.yaml 的 report_rules 段，ID 为 RPT-004~010。
    detected_by: "validate.py 的悬空引用检查（本文件编写时首次运行即报出）"

# ═══════════════════════════════════════════════════════════════
# 6. 历史误判（踩过的坑，别再踩）
# ═══════════════════════════════════════════════════════════════
historical_misjudgments:
  - id: HM-01
    wrong_conclusion: '"非互关 + 空内容" → 403 NOT_MUTUAL_FOLLOW'
    actual: "400（消息内容不能为空）"
    root_cause: "DTO 的 @NotBlank 在 layer 3 执行，互关校验在 layer 4"
    detected: 2026-09-14
    fixed_in: >-
      tests/api/test_message_mutual_follow.py::test_dto_validation_precedes_mutual_check；
      api/endpoints.yaml 的 critical_fact_corrected；
      docs/testing/TEST_COVERAGE_MATRIX.md §7 末行
    lesson: >-
      **读到 Service 里有 403 就以为 403 会赢**是最典型的顺序性错误。
      生成前务必先确认这条规则在 layer 3 有没有对应的 DTO 注解。

  - id: HM-02
    wrong_conclusion: '"头像 URL 不校验 /uploads/ 前缀，不要写外链 400 的断言"'
    actual: "400 INVALID_IMAGE_URL（UserServiceImpl.java:101-104 明确校验）"
    root_cause: "docs/api/users.md 停留在 BUG-005 修复（2026-09-14）之前的旧描述"
    related_rule: USER-004
    lesson: "docs/api/*.md 有滞后，顺序类事实以源码 + 实测为准"

  - id: HM-03
    wrong_conclusion: '"待测代码里存在 EMPTY_COMMENT，所以空评论断言 EMPTY_COMMENT"'
    actual: "400 PARAM_INVALID + 文案'评论内容不能为空'"
    root_cause: "EMPTY_COMMENT 是死枚举（全库无引用）"
    related_issue: C-02
    lesson: "错误码枚举里**存在**不等于**可达**。见 api/error_codes.yaml 与 §4 死分支清单"

