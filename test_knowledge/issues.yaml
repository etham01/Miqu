# AI 检查点
# ═══════════════════════════════════════════════════════════════
ai_checklist:
  - "生成前扫一遍 CONFLICT：命中就用 code_reality，不要用 doc_claim"
  - "UNKNOWN 段涉及的主题**一律不生成**（U-01..U-04）"
  - "INFERRED 段若要断言，先把「实测」作为生成的一个步骤，而不是直接下结论"
  - "MISSING 段里 status=unreachable 的**不计入覆盖分母**，也不要为它生成用例"
  - "MISSING 段里 status=coverage_gap 且标注「推荐生成」的（M-06/M-07）是**优先补的空白**"
  - "发现新的文档-代码不一致 → **登记到这里并修正知识库**，不要就地选一个版本"
