# LIKE 域 —— 点赞（test_cases 已登记 4 条，此处只引用不复制）
# ═══════════════════════════════════════════════════════════════
like_rules:
  domain: LIKE
  registered_in_test_cases: true
  registered_ids: [LIKE-001, LIKE-002, LIKE-003, LIKE-004]
  authoritative_source: "test_cases/core_business_rules.yaml"
  do_not_duplicate: true
  summary_only:
    - {id: LIKE-001, gist: "重复点赞 → 409 ALREADY_LIKED（Service 先查 + uk_post_user 兜底）", frozen: true}
    - {id: LIKE-002, gist: "取消点赞后可再次点赞（post_like **物理删除**，唯一键立即释放）", frozen: true}
    - {id: LIKE-003, gist: "未点赞就取消 → 404 NOT_LIKED", frozen: true}
    - {id: LIKE-004, gist: "like_count 与实际关系行数一致（返回值用 freshLikeCount 重新查库）", frozen: true}
  ai_instruction: >-
    生成点赞用例前，**先读 test_cases/core_business_rules.yaml 的 LIKE 段**取权威定义。
    本文件只作索引，避免维护两份真相。
  additional_related_rules: [NOTI-004（自己不通知自己）, CONC-002（并发重复点赞）]

# ═══════════════════════════════════════════════════════════════
# CMT 域 —— 评论（test_cases 中**未登记**）
# ═══════════════════════════════════════════════════════════════
comment_rules:
  domain: CMT
  registered_in_test_cases: false
  gap_note: "test_cases/*.yaml 中无任何 CMT- 条目（仅 SEC-010 覆盖了「不能删他人评论」）"

  rules:
    - id: CMT-001
      description: 评论内容不能为空
      given: {logged_in: true}
      when: {action: "POST /api/posts/{id}/comments，content 为空串或纯空白"}
      then: {success: false, code: 400, message: 评论内容不能为空}
      related_api: POST_POSTS_ID_COMMENTS
      related_fields: [CommentCreateRequest.content]
      evidence:
        source: "CommentCreateRequest @NotBlank(message='评论内容不能为空') → PARAM_INVALID(400)"
        confidence: CONFIRMED
      dead_error_code_warning: >-
        ⚠️ ErrorCode.EMPTY_COMMENT（文案同为"评论内容不能为空"）是**死枚举，全库无引用**。
        实际触发路径是 DTO @NotBlank → PARAM_INVALID。
        巧合的是**文案字面相同**，断言 message 会通过，
        但规则溯源必须写 PARAM_INVALID / CommentCreateRequest，**不要**写 EMPTY_COMMENT。
        见 issues.yaml C-02。
      boundary: {max_ok: 500, min_fail: 501, max_message: "评论内容不能超过 500 个字符"}

    - id: CMT-002
      description: 非作者且非管理员不能删除评论 → 403
      given: {logged_in_as: B, comment_author: A, b_is_admin: false}
      when: {action: "DELETE /api/comments/{id}"}
      then: {success: false, code: 403, error_code: FORBIDDEN, message: 无权限执行该操作}
      related_api: DELETE_COMMENTS_ID
      evidence: {source: "CommentServiceImpl.java:105-108", confidence: CONFIRMED}
      existing_cases: [SEC-010]
      frozen: true
      priority: P0

    - id: CMT-003
      description: 管理员可删除他人评论
      given: {logged_in_as: admin, comment_author: A}
      when: {action: "DELETE /api/comments/{id}"}
      then: {success: true, code: 200}
      related_api: DELETE_COMMENTS_ID
      evidence: {source: "CommentServiceImpl.java:106", confidence: CONFIRMED}
      existing_cases: [CMT-003]
      note: "SEC-010 的对照用例"

    - id: CMT-004
      description: 评论不存在 → 404
      given: {comment_id: 不存在}
      when: {action: "DELETE /api/comments/{id}"}
      then: {success: false, code: 404, error_code: COMMENT_NOT_FOUND, message: 评论不存在或已被删除}
      related_api: DELETE_COMMENTS_ID
      evidence: {source: "CommentServiceImpl.java:101-103", confidence: CONFIRMED}
      check_order: "404 先于 403（先查存在性，再判权限）"

    - id: CMT-005
      description: 删除评论的计数副作用（带条件）
      given: {comment_exists: true}
      when: {action: "DELETE /api/comments/{id}"}
      then:
        db_assertions:
          - "comment.deleted = 1"
          - "post.comment_count 减 1 —— **仅当 post 仍存在时**"
      related_api: DELETE_COMMENTS_ID
      evidence: {source: "CommentServiceImpl.java:110-117", confidence: CONFIRMED}
      edge_case: "若动态已被删除，则不扣计数（避免对已删动态做无意义更新）"
      confidence_note: "'仅当 post 仍存在'这一条件来自代码逻辑，属 CONFIRMED；具体分支行号见 evidence"

    - id: CMT-006
      description: CommentVO 无独立 userId 字段
      given: {comment_created: true}
      when: {action: "读取 POST /api/posts/{id}/comments 的响应"}
      then:
        assertion: "作者 ID 从 `data['author']['id']` 取（**字符串**），不存在 data['userId']"
      related_api: [POST_POSTS_ID_COMMENTS, GET_POSTS_ID_COMMENTS]
      evidence: {source: "vo/CommentVO.java 字段列表：id, postId, content, mine, author(UserBriefVO), createTime",
                 confidence: CONFIRMED}
      why_it_matters: >-
        ⚠️ 这是**结构性事实**而非业务规则，但 AI 极易写成 data['userId'] 导致 KeyError。
        放在规则库里是为了让 Validator 能拦下这种字段幻觉。

    - id: CMT-007
      description: 不支持回复评论 / 楼中楼（功能未实现）
      given: {any_state: true}
      when: {action: "尝试提交带 parentId 的评论"}
      then: {expectation: "**parentId 会被静默忽略**（DTO 无此字段），产生一条普通顶层评论"}
      related_api: POST_POSTS_ID_COMMENTS
      evidence:
        source: "comment 表有 parent_id / reply_to_user_id 列，但 CommentCreateRequest **不暴露**这两个字段"
        confidence: CONFIRMED
      forbidden_test: "**禁止生成回复评论、楼中楼、评论嵌套层级的测试用例**"
      issue_ref: issues.yaml M-04

# ═══════════════════════════════════════════════════════════════
# NOTI 域 —— 通知（test_cases 中**未登记**，仅 SEC-008 覆盖越权）
# ═══════════════════════════════════════════════════════════════
notification_rules:
  domain: NOTI
  registered_in_test_cases: false
  gap_note: "test_cases/*.yaml 中无任何 NOTI- 条目（SEC-008 覆盖了'不能操作他人通知'）"

  rules:
    - id: NOTI-001
      description: 不能操作他人的通知 → 403
      given: {logged_in_as: A, notification_owner: B}
      when: {action: "PUT /api/notifications/{id}/read"}
      then: {success: false, code: 403, error_code: FORBIDDEN, message: 无权限执行该操作}
      related_api: PUT_NOTIFICATIONS_ID_READ
      evidence: {source: "NotificationServiceImpl.java:151-153", confidence: CONFIRMED}
      existing_cases: [SEC-008]
      frozen: true
      priority: P0

    - id: NOTI-002
      description: 通知不存在 → 404
      given: {notification_id: 不存在}
      when: {action: "PUT /api/notifications/{id}/read"}
      then: {success: false, code: 404, error_code: NOTIFICATION_NOT_FOUND, message: 通知不存在}
      related_api: PUT_NOTIFICATIONS_ID_READ
      evidence: {source: "NotificationServiceImpl.java:146-148", confidence: CONFIRMED}
      check_order: "404 先于 403"

    - id: NOTI-003
      description: 标记已读是幂等的
      given: {notification_is_read: 1}
      when: {action: "PUT /api/notifications/{id}/read（重复调用）"}
      then:
        success: true
        code: 200
        db_assertion: "**不执行 UPDATE**（直接 return）"
      related_api: PUT_NOTIFICATIONS_ID_READ
      evidence: {source: "NotificationServiceImpl.java:155-157", confidence: CONFIRMED}
      test_note: "HTTP 层只能观察到 200；'不执行 UPDATE'需靠日志或 SQL 计数验证，属**弱可测**"

    - id: NOTI-004
      description: 自己对自己不产生通知
      given: {actor_id: X, receiver_id: X}
      when: {action: "点赞/评论自己的动态，或关注自己（关注自己已被 FOL-004 拦）"}
      then:
        assertion: "**不插入 notification 行**"
      evidence: {source: "NotificationServiceImpl.java:190-192（receiverId.equals(actorId) 则直接 return）",
                 confidence: CONFIRMED}
      testable_cases:
        - {action: "点赞自己的动态", expect: "200，且自己的通知列表**无新增**"}
        - {action: "评论自己的动态", expect: "200，且自己的通知列表**无新增**"}
        - {action: "关注自己", expect: "**400 CANNOT_FOLLOW_SELF**（走不到通知逻辑）"}
      assertion_method: "用 unread-count 差值验证（before == after）"

    - id: NOTI-005
      description: 通知产生的三种触发源
      given: {any_state: true}
      when: {action: "关注 / 点赞 / 评论"}
      then:
        notification_created:
          - {trigger: "A 关注 B", type: 1, type_name: FOLLOW, receiver: B, actor: A}
          - {trigger: "A 点赞 B 的动态", type: 2, type_name: LIKE, receiver: B(作者), actor: A, post_id: 该动态}
          - {trigger: "A 评论 B 的动态", type: 3, type_name: COMMENT, receiver: B(作者), actor: A,
             post_id: 该动态, comment_id: 该评论}
      evidence: {source: "NotificationTypeEnum + FollowServiceImpl/PostServiceImpl/CommentServiceImpl 的 notify* 调用",
                 confidence: CONFIRMED}
      no_notification_for:
        - "发帖（**不通知粉丝**）—— 易猜错点"
        - "发私信（type=4 MESSAGE 是 @Deprecated 保留值，一期不用）"
        - "举报"
        - "改资料 / 改密码 / 改头像"
        - "注册"
      content_snapshot: "notification.content 存内容快照，截断至 50 字符（NOTIFICATION_SNAPSHOT_LENGTH）"

    - id: NOTI-006
      description: 取消动作会**物理删除**对应通知
      given: {notification_exists: true}
      when: {action: "取消关注 / 取消点赞 / 删除动态"}
      then:
        db_assertion: "对应 notification 行被**物理删除**（不是 deleted=1）"
      evidence:
        source: "FollowServiceImpl.removeFollowNotification、PostServiceImpl.removeLikeNotification / removePostNotifications"
        confidence: CONFIRMED
      why_it_matters: >-
        ⚠️ notification 表**有** deleted 列（软删除），但这几处是**物理删除**。
        直接 SQL 断言时行已消失，不是 deleted=1。混用两种删除方式是易错点。
      observable_via_api: "取消后 GET /api/notifications 与 unread-count 都不再包含该条"

    - id: NOTI-007
      description: 通知查询只返回当前用户的通知
      given: {logged_in_as: A}
      when: {action: "GET /api/notifications"}
      then: {assertion: "只返回 user_id = A 的通知；**无法查询他人通知**"}
      related_api: GET_NOTIFICATIONS
      evidence: {source: "NotificationServiceImpl 查询条件固定带 user_id = currentUserId", confidence: CONFIRMED}
      no_filter_param: "**无 userId 查询参数**可越权查他人通知"

    - id: NOTI-008
      description: 通知无"标记未读"能力
      given: {notification_is_read: 1}
      when: {action: "尝试把已读通知改回未读"}
      then: {expectation: "**无此 API**"}
      evidence: {source: "NotificationController 只有 /{id}/read 与 /read-all，无 unread 端点", confidence: CONFIRMED}
      forbidden_test: "**禁止生成'标记未读'的用例**"
      state_machine_ref: states/state_machines.yaml → notification_is_read（单向 0→1）

# ═══════════════════════════════════════════════════════════════
# FOL 域 —— 关注（test_cases 已登记 6 条，此处引用 + 补充未登记的顺序规则）
# ═══════════════════════════════════════════════════════════════
follow_rules:
  domain: FOL
  registered_in_test_cases: true
  registered_ids: [FOL-001, FOL-002, FOL-003, FOL-004, FOL-005, FOL-006]
  authoritative_source: "test_cases/core_business_rules.yaml"
  summary_only:
    - {id: FOL-001, gist: "重复关注 → 409 ALREADY_FOLLOWED", frozen: true}
    - {id: FOL-002, gist: "取消关注后可重新关注（follow 表**物理删除**）", frozen: true}
    - {id: FOL-003, gist: "未关注就取消 → 404 NOT_FOLLOWED", frozen: true}
    - {id: FOL-004, gist: "不能关注自己 → 400 CANNOT_FOLLOW_SELF", frozen: true}
    - {id: FOL-005, gist: "不能关注被禁用用户 → 423", frozen: true}
    - {id: FOL-006, gist: "关注不存在/已注销用户 → 404 USER_NOT_FOUND", frozen: true}

  additional_rules_not_in_test_cases:
    - id: FOL-007
      description: 关注操作的完整校验顺序
      given: {multiple_violations: true}
      when: {action: "POST /api/users/{id}/follow"}
      then:
        order:
          - "1. currentUserId == null → 401 UNAUTHORIZED"
          - "2. currentUserId.equals(targetUserId) → 400 CANNOT_FOLLOW_SELF"
          - "3. requireActiveUser(currentUserId) → 404/423"
          - "4. requireActiveUser(targetUserId) → 404/423"
          - "5. isFollowing(current,target) → 409 ALREADY_FOLLOWED"
          - "6. insert（uk_follower_following 兜底 → 409 ALREADY_FOLLOWED）"
      evidence: {source: "FollowServiceImpl.java:46-68", confidence: CONFIRMED}
      cross_ref: rules/validation_order.yaml → FOLLOW
      testable_overlap_cases:
        - {case: "禁用用户关注自己", expect: "400 CANNOT_FOLLOW_SELF（步骤 2 先于步骤 3）", confidence: CONFIRMED}
        - {case: "关注自己且已关注过（不可能）", expect: "N/A"}
        - {case: "关注一个禁用用户，且已关注过", expect: "423（步骤 4 先于步骤 5）", confidence: CONFIRMED}

    - id: FOL-008
      description: 关注/取消关注对**互关状态**与**私信能力**的连带影响
      given: {a_and_b_mutual: true}
      when: {action: "A 取消关注 B"}
      then:
        immediate_effects:
          - "互关状态被破坏"
          - "A 向 B 发私信 → **403 NOT_MUTUAL_FOLLOW**"
          - "B 向 A 发私信 → **403 NOT_MUTUAL_FOLLOW**"
          - "A 打开与 B 的会话 → **403 NOT_MUTUAL_FOLLOW**"
        preserved:
          - "**已有会话不消失**（conversation 无 deleted 列）"
          - "**历史消息仍可读**（GET /api/conversations/{id}/messages 只校验成员身份，不校验互关）"
        after_re_follow:
          - "A 重新关注 B 且 B 关注 A → 互关恢复 → **可继续发消息**"
          - "会话仍是**同一个** id（uk_users 保证唯一）"
      evidence:
        source: "MessageServiceImpl.java:56 / ConversationServiceImpl.java:103（互关校验）；ConversationServiceImpl requireMember（读消息只校验成员）"
        confidence: CONFIRMED
      why_it_matters: >-
        ⚠️ 这是本项目**最重要的冻结业务规则组合**，也是最反直觉的部分：
        取消互关后"不能发新消息"但"能读历史"。
        AI 容易猜成"取消互关后会话消失"或"历史也读不了"。
      cross_ref: [workflows/workflows.yaml → WF-03, MSG-013, CONV-009]
      priority: P0
      frozen: true

# ═══════════════════════════════════════════════════════════════
# CONV / MSG 域 —— 会话与私信（test_cases 已登记 13+14 条，此处只引用）
# ═══════════════════════════════════════════════════════════════
conversation_message_rules:
  domains: [CONV, MSG]
  registered_in_test_cases: true
  registered_ids:
    CONV: [CONV-001, CONV-002, CONV-003, CONV-004, CONV-005, CONV-006, CONV-007,
           CONV-008, CONV-009, CONV-010, CONV-011, CONV-012, CONV-013]
    MSG: [MSG-001, MSG-002, MSG-003, MSG-004, MSG-005, MSG-006, MSG-007,
          MSG-008, MSG-009, MSG-010, MSG-011, MSG-012, MSG-013, MSG-014]
  authoritative_source: "test_cases/core_business_rules.yaml"
  do_not_duplicate: true
  frozen_headline_rule: "**私信要求双方互相关注**（NOT_MUTUAL_FOLLOW 403）—— 项目最高优先级冻结规则"

  domain_boundary:
    rule: >-
      凡"能不能发/能不能读消息"归 **MSG**；
      凡"能不能打开会话/是不是会话成员"归 **CONV**。
    source: "docs/testing/TEST_CASE_SCHEMA.md §3"
    reason: >-
      此前 CONV-007/CONV-008 出现过"同一行为被两条 ID 各描述一遍"的冲突，
      根因就是没定分界。这条分界是**有意写死**的。
    ai_instruction: "生成新用例时按此分界选前缀，不要跨域重复登记同一行为"

  critical_facts_ai_must_know:
    - id: MSGFACT-01
      fact: "非互关时：不能发消息(403)、不能打开会话(403)、不能创建会话(403)"
      confidence: CONFIRMED
    - id: MSGFACT-02
      fact: "取消互关后：不能发**新**消息，但**历史消息仍可读**、会话仍存在"
      confidence: CONFIRMED
      related: [MSG-013, CONV-009]
    - id: MSGFACT-03
      fact: "读消息只校验**会话成员身份**（403 NOT_CONVERSATION_MEMBER），**不校验互关**"
      confidence: CONFIRMED
    - id: MSGFACT-04
      fact: >-
        "非互关 + 空内容" 返回 **400**（不是 403）—— DTO @NotBlank 在 Controller 层
        先于 Service 的互关校验执行。
      confidence: CONFIRMED
      historical_correction: "曾误记为 403，2026-09-14 实测修正，TEST_COVERAGE_MATRIX.md 已更新"
    - id: MSGFACT-05
      fact: "同一对用户**只有一个会话**（uk_users + CHECK user1_id < user2_id），重复打开返回同一 id"
      confidence: CONFIRMED
    - id: MSGFACT-06
      fact: "GET /api/conversations/{id}/messages 返回**裸数组**，不是 PageResult"
      confidence: CONFIRMED
    - id: MSGFACT-07
      fact: "发私信**不产生通知**（type=4 MESSAGE 是 @Deprecated）"
      confidence: CONFIRMED
    - id: MSGFACT-08
      fact: "未读数是 conversation 表上的**两个独立计数器**（user1_unread/user2_unread），发消息只增接收方"
      confidence: CONFIRMED

  additional_rules_not_in_test_cases:
    - id: MSG-015
      description: 消息 DTO 校验**先于** Service 互关校验
      given: {not_mutual: true, content_blank: true}
      when: {action: "POST /api/messages"}
      then: {success: false, code: 400, message: 消息内容不能为空}
      not_expected: {code: 403, why: "互关校验在 Service 层，晚于 Controller 的 @Valid"}
      evidence: {source: "MessageSendRequest.java:24-25 + MessageServiceImpl.java:43-63", confidence: CONFIRMED}
      cross_ref: rules/validation_order.yaml → MESSAGE_SEND
      note: "此即 MSGFACT-04 的规则化表述"

    - id: MSG-016
      description: 消息内容长度上限 1000
      given: {mutual: true, content_length: 1001}
      when: {action: "POST /api/messages"}
      then: {success: false, code: 400, message: 消息内容不能超过 1000 个字符}
      evidence: {source: "MessageSendRequest.java:25 + BizConstants.MESSAGE_CONTENT_MAX=1000", confidence: CONFIRMED}
      related_registered: MSG-014
      boundary: {max_ok: 1000, min_fail: 1001}

    - id: MSG-017
      description: 发消息的完整校验顺序
      given: {multiple_violations: true}
      when: {action: "POST /api/messages"}
      then:
        order:
          - "0. **Bean Validation（Controller 层，最先）** → 400 PARAM_INVALID"
          - "1. requireActiveUser(senderId) → 401/404/423"
          - "2. userId.equals(receiverId) → 400 CANNOT_MESSAGE_SELF"
          - "3. requireActiveUser(receiverId) → 404/423"
          - "4. !isMutual(userId,receiverId) → 403 NOT_MUTUAL_FOLLOW"
          - "5. content.isEmpty() → 400（Service 层，通常不可达）"
      evidence: {source: "MessageServiceImpl.java:43-63", confidence: CONFIRMED}
      cross_ref: rules/validation_order.yaml → MESSAGE_SEND

    - id: CONV-014
      description: 打开会话的完整校验顺序
      given: {multiple_violations: true}
      when: {action: "POST /api/conversations"}
      then:
        order:
          - "0. Bean Validation（targetUserId @NotNull）→ 400"
          - "1. requireActiveUser(userId) → 401/404/423"
          - "2. userId.equals(targetUserId) → 400 CANNOT_MESSAGE_SELF"
          - "3. requireActiveUser(targetUserId) → 404/423"
          - "4. !isMutual(userId,targetUserId) → 403 NOT_MUTUAL_FOLLOW"
      evidence: {source: "ConversationServiceImpl.java:94-107", confidence: CONFIRMED}
      note: "打开会话与发消息共用 CANNOT_MESSAGE_SELF 与 NOT_MUTUAL_FOLLOW"

    - id: CONV-015
      description: 并发首次创建会话应恰好成功一次
      given: {no_conversation_yet: true, concurrent_requests: N}
      when: {action: "N 个线程同时 POST /api/conversations（同一对用户）"}
      then:
        assertion: "**全部返回 200 且 conversation id 相同**（不是 1 个 200 + N-1 个 409）"
      evidence:
        source: "ConversationServiceImpl.java:49-55,172-195（TransactionTemplate PROPAGATION_REQUIRES_NEW）"
        confidence: CONFIRMED
      root_cause_of_historical_bug: >-
        MySQL REPEATABLE READ 下，同一事务内普通 SELECT 看不到并发事务刚提交的会话行
        → 重查仍为 null → 误报 409。SELECT...FOR UPDATE 会死锁。
        解法是用 REQUIRES_NEW 开新事务重查（新事务有全新 read view）。
      related_registered: CONC-005
      uncovered_extent: "test_cases 登记的 CONC-007（数十线程同一瞬间首建会话）仍是 **gap**，本次只做到 8 线程"
      issue_ref: issues.yaml M-02

# ═══════════════════════════════════════════════════════════════
# RPT 域 —— 举报（⚠️ 前缀未被 check_consistency.py 接受，见 issues.yaml C-05）
# ═══════════════════════════════════════════════════════════════
report_rules:
  domain: RPT
  prefix_status: >-
    ⚠️ **提议中的新前缀**。check_consistency.py 的 VALID_PREFIXES（14 个）中
    **没有举报域前缀**：SRCH 已被 TEST_CASE_SCHEMA.md 定义为"搜索"（对应 test_search.py）。
    本域规则在 test_cases/*.yaml 中**未登记**（相关安全场景散落在 SEC- 下）。
    → 若要把 RPT-* 写入 test_cases/，必须先扩展 VALID_PREFIXES 加入 RPT，
      否则 check_consistency.py 会报"未知前缀"。见 issues.yaml C-05。
  registered_in_test_cases: false

  rules:
    - id: RPT-001
      description: 不能举报自己
      given: {logged_in_as: A, target_owner: A}
      when: {action: "POST /api/reports"}
      then: {success: false, code: 400, error_code: CANNOT_REPORT_SELF, message: 不能举报自己}
      related_api: POST_REPORTS
      evidence: {source: "ReportServiceImpl.java:80-82", confidence: CONFIRMED}
      note: "target_owner 由 resolveTargetOwner 解析：用户→本人；动态/评论→其作者"

    - id: RPT-002
      description: 同一人对同一目标不能重复举报
      given: {already_reported: true}
      when: {action: "POST /api/reports（同 reporter + 同 targetType + 同 targetId）"}
      then: {success: false, code: 409, error_code: ALREADY_REPORTED, message: 你已经举报过该内容}
      related_api: POST_REPORTS
      evidence: {source: "ReportServiceImpl.java:85-90 + uk_reporter_target", confidence: CONFIRMED}
      uniqueness_semantics: >-
        唯一键是 (reporter_id, target_type, target_id)。
        → **同一人**重复举报同一目标 = 409；**不同人**举报同一目标 = **200**（合法）。
        AI 容易误以为"同一目标只能被举报一次"。
      reason_type_irrelevant: "换 reasonType 重复举报同一目标**仍是 409**（唯一键不含 reason_type）"

    - id: RPT-003
      description: 举报目标不存在 → 404（按 targetType 分别返回对应文案）
      given: {target_not_exists: true}
      when: {action: "POST /api/reports"}
      then:
        by_target_type:
          - {targetType: 1, code: 404, error_code: USER_NOT_FOUND, message: 用户不存在}
          - {targetType: 2, code: 404, error_code: POST_NOT_FOUND, message: 动态不存在或已被删除}
          - {targetType: 3, code: 404, error_code: COMMENT_NOT_FOUND, message: 评论不存在或已被删除}
      related_api: POST_REPORTS
      evidence: {source: "ReportServiceImpl.resolveTargetOwner", confidence: CONFIRMED}
      check_order: "在 CANNOT_REPORT_SELF 之前（要先解析出 owner 才能比较）"

    - id: RPT-004
      description: targetType=4 的 Service 分支不可达
      given: {targetType: 4}
      when: {action: "POST /api/reports"}
      then: {success: false, code: 400, error_code: PARAM_INVALID, message: 举报目标类型只能是 1、2 或 3}
      not_expected: {error_code: INVALID_TARGET_TYPE, why: "DTO @Max(3) 先拦，Service 分支走不到"}
      related_api: POST_REPORTS
      evidence: {source: "CreateReportRequest @Max(3) + ReportServiceImpl.java:74-76", confidence: CONFIRMED}
      doc_conflict:
        doc_claim: "docs/api/reports.md 称传 4 返回 INVALID_TARGET_TYPE"
        code_reality: "返回 PARAM_INVALID + '举报目标类型只能是 1、2 或 3'"
        verdict: 以代码为准
        issue_ref: issues.yaml C-03
      note: "TargetTypeEnum.isValid() 接受 1~4（4=REPORT 供 admin_operation_log 用），但举报 DTO 只允许 1~3"

    - id: RPT-005
      description: 已处理的举报不能重复处理
      given: {report_status: "1(HANDLED) 或 2(REJECTED)"}
      when: {action: "PUT /api/admin/reports/{id}/handle"}
      then: {success: false, code: 409, error_code: REPORT_ALREADY_HANDLED, message: 该举报已被处理}
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: "ReportServiceImpl.java:166-168", confidence: CONFIRMED}
      seed_data_available: "data.sql 的 5 条举报中已有 status=1 与 status=2 的样本，可直接测"
      state_machine_ref: states/state_machines.yaml → report_status

    - id: RPT-006
      description: 驳回举报时不能同时执行处置动作
      given: {status: 2, action: "非 NONE"}
      when: {action: "PUT /api/admin/reports/{id}/handle"}
      then: {success: false, code: 400, error_code: REJECT_WITH_ACTION_NOT_ALLOWED,
             message: 驳回举报时不能同时执行处置动作}
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: "ReportServiceImpl.java:174-177", confidence: CONFIRMED}
      semantic_reason: "驳回意味着'举报不成立'，同时删帖/封号自相矛盾"

    - id: RPT-007
      description: 处置动作必须与举报目标类型匹配
      given: {action_and_target_mismatch: true}
      when: {action: "PUT /api/admin/reports/{id}/handle"}
      then: {success: false, code: 400, error_code: REPORT_ACTION_MISMATCH,
             message: 处置动作与举报目标类型不匹配}
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: "ReportServiceImpl.java:225-235", confidence: CONFIRMED}
      matching_matrix:
        - {action: NONE, allowed_target_types: [1, 2, 3]}
        - {action: DELETE_POST, allowed_target_types: [2]}
        - {action: DELETE_COMMENT, allowed_target_types: [3]}
        - {action: DISABLE_USER, allowed_target_types: [1]}
      mismatch_examples:
        - {action: DELETE_POST, targetType: 3, expect: 400}
        - {action: DISABLE_USER, targetType: 2, expect: 400}
        - {action: DELETE_COMMENT, targetType: 1, expect: 400}

    - id: RPT-008
      description: 不支持的处置动作 → 400
      given: {action: "非枚举值（如 BAN_USER）"}
      when: {action: "PUT /api/admin/reports/{id}/handle"}
      then: {success: false, code: 400, error_code: INVALID_REPORT_ACTION, message: 不支持的处置动作}
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: "ReportServiceImpl.java:216-222（ReportActionEnum.of 抛 IllegalArgumentException）",
                 confidence: CONFIRMED}
      case_insensitivity: "合法动作名**大小写不敏感**（delete_post 也接受）"

    - id: RPT-009
      description: 举报不存在 → 400（**不是 404**），且文案被覆盖
      given: {report_id: 不存在}
      when: {action: "PUT /api/admin/reports/{id}/handle"}
      then: {success: false, code: 400, error_code: NOT_FOUND, message: 举报不存在}
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: 'ReportServiceImpl.java:162-164 BizException.of(ErrorCode.NOT_FOUND, "举报不存在")',
                 confidence: CONFIRMED}
      ⚠️_double_anomaly:
        anomaly_1: "ErrorCode.NOT_FOUND 的 code 是 **404**，但此处实际返回 **400**"
        anomaly_2: "文案被覆盖为'举报不存在'，而非 NOT_FOUND 默认的'资源不存在'"
        confidence: INFERRED
        inference_basis: >-
          子代理报告称"实际抛出时使用覆盖文案，响应 message 是'举报不存在'"，
          并标注 code=400。但 ErrorCode.NOT_FOUND 定义的是 404。
          **两者矛盾，我无法从现有证据判定实际返回的 code 是 400 还是 404。**
        ai_instruction: >-
          ⚠️ **禁止直接断言此条的 code**。生成用例前必须先实测确认（写一条探测用例，
          或读 BizException.of(errorCode, message) 的实现确认它是否改写 code）。
          可先安全断言 message == "举报不存在"。
        issue_ref: issues.yaml C-04

    - id: RPT-010
      description: 举报处置的级联副作用
      given: {report_pending: true}
      when: {action: "PUT /api/admin/reports/{id}/handle，status=1 + action=DELETE_POST/DELETE_COMMENT/DISABLE_USER"}
      then:
        db_assertions:
          - "report.status = 1, handler_id = 当前管理员, handle_time 非空"
          - "action=DELETE_POST → 该动态被逻辑删除（含 POST-007 的全部级联）"
          - "action=DELETE_COMMENT → 该评论被逻辑删除 + post.comment_count 减 1"
          - "action=DISABLE_USER → 目标 user.status = 0（其 Token 立即失效 → 423）"
          - "写 admin_operation_log（HANDLE_REPORT + 具体动作）"
      related_api: PUT_ADMIN_REPORTS_ID_HANDLE
      evidence: {source: "ReportServiceImpl.java:180-194 applyAction", confidence: CONFIRMED}
      exception_swallowing: >-
        ⚠️ applyAction 中"目标不存在"的异常会被**吞掉**（举报仍标记为已处理），
        其余异常重抛。这是有意设计（举报的目标可能已被删）。
      cross_ref: rules/side_effects.yaml → HANDLE_REPORT

