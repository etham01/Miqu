server:
  # 默认 8081 而非 8080：本机上 8080 已被 Windows 服务 ApplicationWebServer.exe 长期占用，
  # 用 8080 会直接 "Port 8080 was already in use" 启动失败。
  # 换机器或该服务停用后，可通过环境变量覆盖：SERVER_PORT=8080
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      # 只强制请求编码。若用 force: true 连响应一起强制，
      # 静态图片会被加上 "Content-Type: image/png;charset=UTF-8" ——
      # 给二进制资源标注字符集是错误的。JSON 响应的 UTF-8 由 Jackson 转换器自身保证，
      # 不依赖这里的响应强制。
      force-request: true
      force-response: false

spring:
  application:
    name: miqu

  # 默认激活 local profile，从 application-local.yml 读取本机数据库口令。
  #
  # 目的：在 IDEA 里直接点 Run 就能启动，不必配置 Run Configuration 的环境变量。
  # application-local.yml 已被 .gitignore 排除，口令不会被提交。
  #
  # 临时换口令不用改文件：DB_PASSWORD=xxx 即可覆盖。
  # （前提是 local 文件里写的是 ${DB_PASSWORD:root} 而不是字面量，原因见该文件注释）
  # 部署到服务器时用 SPRING_PROFILES_ACTIVE=prod 切走，就不会加载本机配置。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ------------------------------------------------------------
  # 数据源
  #   数据库连接信息通过环境变量注入，不要把生产凭据提交进仓库。
  #   本地开发可设置：DB_USERNAME / DB_PASSWORD
  # ------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:miqu}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      # 5 秒而不是默认的 30 秒：本地开发时数据库没起来应该**立刻**报错，
      # 而不是让每个请求都卡半分钟。生产环境可按需调回 30000。
      connection-timeout: 5000
      pool-name: MiquHikariPool

  # 时间相关：serverTimezone 与 jackson.time-zone 必须一致，否则前端会看到 8 小时的偏差
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# ------------------------------------------------------------
# MyBatis-Plus
# ------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 全局逻辑删除约定；实体上仍有 @TableLogic 显式标注，二者一致
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL；生产环境改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    call-setters-on-nulls: true

# ------------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ------------------------------------------------------------
# 项目自定义配置
# ------------------------------------------------------------
miqu:
  jwt:
    # ⚠️ 生产环境必须用环境变量覆盖。HS256 要求至少 32 字节，启动时会校验。
    secret: ${JWT_SECRET:miqu-dev-only-secret-key-please-change-in-production}
    # 7 天
    expire-seconds: 604800
    issuer: miqu

  upload:
    base-dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads

  auth:
    # 免登录白名单，格式：METHODS:/ant/path（METHODS 可省略表示任意方法）
    # 策略是"失败关闭"：不在此列表中的 /api/** 一律要求登录。
    white-list:
      - "POST:/api/auth/register"
      - "POST:/api/auth/login"
      - "GET:/api/health"

      # 动态：游客可浏览列表与详情
      - "GET:/api/posts"
      - "GET:/api/posts/{id:[0-9]+}"
      - "GET:/api/posts/{id:[0-9]+}/likes"
      - "GET:/api/posts/{id:[0-9]+}/comments"

      # 用户：只放行「数字 ID」形式的主页路径。
      # 用 {id:[0-9]+} 而不是 * —— 否则 /api/users/me 会被一并放行，
      # 个人中心就变成了免登录可访问。
      - "GET:/api/users/search"
      - "GET:/api/users/{id:[0-9]+}"
      - "GET:/api/users/{id:[0-9]+}/posts"
      - "GET:/api/users/{id:[0-9]+}/following"
      - "GET:/api/users/{id:[0-9]+}/followers"

logging:
  level:
    root: info
    com.miqu: debug
    # 关闭 MyBatis 把 SQL 参数展开时的冗长输出
    org.springframework.jdbc: info
