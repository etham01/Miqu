dead_branches:
  desc: >-
    这些分支在源码里存在，但**HTTP 层没有任何输入能触达**。
    AI 生成针对它们的用例必然是"永远失败"的用例（不是缺陷，是测试设计错误）。
    本清单与 test_cases/README.md §已知缺口、issues.yaml 的 MISSING 段保持同一口径。
  items:
    - id: DB-01
      branch: "EMPTY_COMMENT(400)"
      location: ErrorCode.EMPTY_COMMENT
      reason: >-
        全库无任何引用（死枚举）。空评论由 CommentCreateRequest 的 @NotBlank 在 layer 3
        拦为 PARAM_INVALID(400)，文案"评论内容不能为空"。
      actual_code: "400 PARAM_INVALID"
      corresponding_issue: C-02
      ai_instruction: "断言 400 + message='评论内容不能为空'，**不要**断言 EMPTY_COMMENT 这个枚举名"

