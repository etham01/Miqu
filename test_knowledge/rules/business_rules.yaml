    registered_ids: "SMK-001 ~ SMK-027（27 条）"
    source_file: test_cases/api_smoke.yaml
    purpose: "冒烟集合（pytest -m smoke，43 条），对外演示 / CI 首轮必须走通的主路径"
    note: "SMK 条目是**分组**登记（12 组），与单个用例不是 1:1"

# ═══════════════════════════════════════════════════════════════
# 跨域规则（不属于单一域，但对测试设计至关重要）
# ═══════════════════════════════════════════════════════════════
cross_cutting_rules:
  - id: XC-001
    description: HTTP 状态码恒为 200，业务结果只看 body.code
    scope: "全部 /api/** 端点"
    then: {assertion_rule: "**永远不要断言 response.status_code**（恒 200，断言无意义或恒假）"}
    sole_exception: "/uploads/** 静态资源缺失 → 真 HTTP 404"
    evidence: {source: "GlobalExceptionHandler 全部 handler 返回 Result，无 @ResponseStatus", confidence: CONFIRMED}
    priority: P0
    ai_impact: "**最高频的 AI 错误来源**。必须在每条用例的断言中体现。"

  - id: XC-002
    description: 所有 id 类字段序列化为字符串，所有计数类字段序列化为数字
    scope: 全部响应
    then:
      assertion_rule: 'data["id"] == "2"（字符串）；data["likeCount"] == 10（数字）'
    evidence: {source: "config/JacksonConfig.java + docs/api/API_CONVENTIONS.md §7", confidence: CONFIRMED}
    reason: "JS Number 精度只有 53 位，Long 直传会丢精度"
    ai_impact: "类型写错会导致断言恒假（'2' != 2）"

  - id: XC-003
    description: 逻辑删除的数据对 API 不可见，但**仍在库里**
    scope: "user / post / comment / message / notification"
    then:
      api_behavior: "查不到 → 返回对应的 *_NOT_FOUND(404)"
      sql_assertion_rule: "直接查库必须显式带 `deleted = 0` 条件"
    evidence: {source: "BaseEntity @TableLogic + application.yml:75-76", confidence: CONFIRMED}

  - id: XC-004
    description: 关系表是物理删除，取消后唯一键立即释放
    scope: "follow / post_like / post_image"
    then: {assertion_rule: "取消关注/点赞后可**立即**重新建立；直接查库时**行已消失**（不是 deleted=1）"}
    evidence: {source: "BaseCreateEntity 无 @TableLogic；schema.sql 中这些表无 deleted 列", confidence: CONFIRMED}
    related_rules: [FOL-002, LIKE-002]

  - id: XC-005
    description: 冗余计数与实际关系行数是两条独立断言
    scope: "like_count / comment_count / image_count / following_count / follower_count / post_count"
    then:
      assertion_pattern: "操作后同时断言：① API 返回的计数值 ② 关系表实际行数（如可查）"
    evidence: {source: "schema.sql 冗余列 + 各 ServiceImpl 的 incr/decr + freshXxxCount 重查", confidence: CONFIRMED}
    historical_issue: "并发场景下曾出现计数与实际不一致，故 test_concurrency.py 专门断言此点"

  - id: XC-006
    description: 一个请求同时违反多条规则时，预期码由**代码校验顺序**决定
    scope: 全部
    then: {ai_instruction: "**生成叠加违规用例前必须先读 rules/validation_order.yaml**"}
    known_cases: [AUTH-005, USER-014, FOL-007, MSG-015, MSG-017, CONV-014, RPT-004]
    historical_error: "'非互关 + 空内容'曾误记为 403，实测为 400（2026-09-14 修正）"
    priority: P0

  - id: XC-007
    description: pytest 断言用差值，不用绝对值（幂等纪律）
    scope: "tests/ 下全部 pytest 用例"
    then:
      forbidden: 'assert admin_client.get("/api/admin/stats").data["userTotal"] == 21'
      required: "before = ...; 操作; after = ...; assert after == before + 1"
      sole_exception: "针对**种子数据样本**的绝对值断言（如 post id=1 有 9 张图）"
    evidence: {source: "docs/testing/MIQU_TEST_SYSTEM.md §6 纪律 2 + §7 幂等性", confidence: CONFIRMED}
    reason: "写入真实落库且**无删除用户接口**，库里数据随运行次数增长"
