      effect: 补发带 type=2 的请求；列表中不得再出现「关注了你」
    pytest: null
    browser: browser_regression.mjs::BUG-004
    status: implemented
    history: |
      2026-09-14 修复前实测：高亮「点赞」，只发出 ?page=1&size=20（无 type=2），
      列表里混着「关注了你」—— 筛选器形同虚设。
      修复：NotificationView.load() 同款请求序号。

  - id: CONC-011
    title: 取消关注后，对方动态必须立刻从「我的关注」消失
    priority: P2
    type: ui_state_race
    rule: |
      「关注动态」定义为**当前有效关注关系**（docs/design.md L485）。
      本用例是 BUG-001 的固定回归守卫：该现象经五路交叉验证为**未复现**（NOT_A_BUG），
      行为本来就是对的，登记它是为了防止将来被改坏。
    frozen_at: 2026-09-14
    preconditions:
      - A 关注 B，B 已发布动态
    steps:
      - A 查看「我的关注」，确认能看到 B 的动态
      - A 进入 B 主页取消关注
      - A 回首页再次查看「我的关注」
    expected:
      code: 200
      effect: |
        followedByMe=false；
        切到「我的关注」时确实重新请求 tab=following；
        B 的动态不再出现（硬刷新后同样不出现）
    pytest: null
    browser: browser_regression.mjs::BUG-001
    status: implemented
    history: |
      2026-09-14 Bug Hunt 首次登记。API + DB + 真实浏览器 + Code Review 四路证据
      一致表明后端与前端行为都正确（详见 docs/testing/bug_report.md）。
      固化为长期回归用例。

  - id: CONC-012
    title: 头像取不到时必须降级为首字母占位，而不是永久破图
    priority: P1
    type: ui_state_race
    rule: |
      图片加载失败（404 / 外链被拦 / 非图片内容）时，头像要退化成首字母占位，
      与"没配头像"的表现一致（BUG-006 已修复）。
      全站 15 处头像共用 `components/UserAvatar.vue`，所以这一层兜底全站生效。
    frozen_at: 2026-09-16
    preconditions:
      - A 的头像被写成"前缀合法、但磁盘上不存在"的路径
    steps:
      - 用真实浏览器打开 A 的主页
    expected:
      effect: |
        页面上 0 个解码失败的 <img>；出现首字母占位 <span>
    pytest: null
    browser: browser_regression.mjs::BUG-006
    status: implemented
    history: |
      2026-09-16 修复前实测：`UserAvatar.vue` 只有 `v-if="src"`（判断有没有值），
      没有 `@error`（判断能不能加载出来）→ 2 个 <img> naturalWidth=0、
      首字母占位 0 个。截图 .workbuddy/screenshots/avatar-broken-fallback.png。
      修复：加 failed 状态 + `@error` 兜底 + watch(src) 让换头像后重试。
      同批发现的 BUG-007（静态 404 被包成 200）与 BUG-008
      （头像接口不校验文件存在）见 docs/testing/avatar-issue-diagnosis.md。
