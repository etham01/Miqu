# ═════════════════════════════════════════════
# 五、冗余计数字段（一致性断言的目标）
# ═════════════════════════════════════════════
redundant_counters:
  desc: >-
    这些字段是**冗余计数**，由 Service 层用原子 incr/decr SQL 维护。
    它们与关系表的实际行数是**两条独立断言**——历史上出现过不一致。
  counters:
    - {table: user, column: following_count, truth_source: "follow 表中 follower_id = 该用户 的行数"}
    - {table: user, column: follower_count, truth_source: "follow 表中 following_id = 该用户 的行数"}
    - {table: user, column: post_count, truth_source: "post 表中 user_id = 该用户 且 deleted=0 的行数"}
    - {table: post, column: like_count, truth_source: "post_like 表中 post_id = 该动态 的行数"}
    - {table: post, column: comment_count, truth_source: "comment 表中 post_id = 该动态 且 deleted=0 的行数"}
    - {table: post, column: image_count, truth_source: "post_image 表中 post_id = 该动态 的行数"}
  consistency_test_pattern: >-
    高价值断言模式（项目已有惯例，见 test_concurrency.py）：
      并发操作后 → 断言 API 返回的计数 == 期望值 == 关系表实际行数
    例：并发重复关注 → followerCount == 1（不是 2）
  anti_dirty_read: >-
    返回值用 freshXxxCount() **重新查库**取最新值，避免并发下的脏读
    （PostServiceImpl.java:333-336、FollowServiceImpl.java:155-158）。
  data_sql_recompute: >-
    database/data.sql 末尾有统一重算脚本，保证种子数据的冗余计数与关系表一致。
    → 重置数据库后计数一定是准的。
