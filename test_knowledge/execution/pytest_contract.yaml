# pytest 执行契约
#
# 用途：让 AI 生成的用例**第一次就能跑通**。这是"可执行性"的关键文件 ——
#       它不是描述"项目有什么测试"，而是规定"你生成的代码必须长什么样"。
#
# 为什么必须单独成文：
#   AI 默认会用"标准的 requests 写法"：`requests.get(url)`、`assert resp.status_code == 403`、
#   `assert resp.json()["data"]["total"] == 21`。
#   这三条在本项目**全是错的**：
#     · 断言 status_code 恒真（XC-001）
#     · 绝对计数第二次运行就挂（XC-007）
#     · 没有 Token 会全部 401
#   本文件把这些坑固化成"照抄就能用"的模板。
#
# 消费者：LLM（生成代码）｜Pydantic（校验 fixture 名与字段名真实存在）｜执行器（直接运行）
#
# 真相来源（逐行读取）：
#   tests/conftest.py（夹具全集）
#   tests/utils/client.py（ApiClient 与 ApiResponse）
#   tests/pytest.ini（markers / testpaths / addopts）
#   tests/api/*.py（实际写法）
#   docs/testing/MIQU_TEST_SYSTEM.md §6（硬纪律）
#
# confidence: CONFIRMED
# verified_at: 2026-09-17（250 条用例全部 collected 成功）

meta:
  generated_at: 2026-09-17
  suite_size: 250
  file_count: 13
  location: tests/
  collection: "pytest --collect-only 实测 250 tests collected"

# ═══════════════════════════════════════════════════════════════
# 1. 运行环境（生成代码时必须假设的事实）
# ═══════════════════════════════════════════════════════════════
environment:
  base_url:
    default: http://localhost:8081
    override: ["--base-url 命令行参数", "MIQU_BASE_URL 环境变量"]
    source: tests/conftest.py:26,45-51
    port_reason: "8081 而非 8080 —— 本机 8080 被 Windows 服务 ApplicationWebServer.exe 占用"
  auth: "JWT，Authorization: Bearer <token>；有效期 604800 秒"
  database:
    kind: MySQL
    name: miqu
    reset: |
      mysql -u root -p < database/schema.sql
      mysql -u root -p < database/data.sql
    note: "pytest **不需要**每次都重置（套件幂等）；JUnit 需要"
  prerequisites:
    - "后端必须已启动（conftest 的 ensure_backend_running 会探活，未启动则 pytest.exit(1)）"
    - "启动命令：cd backend && mvn spring-boot:run（默认 8081）"
    - "⚠️ 本机 mvn 命令本身不可用，需用包装脚本 .workbuddy/tools/mvn.sh；启动 jar 要显式 --server.port=8081 并 unset SERVER__PORT"
  proxy_warning:
    critical: >-
      🔴 运行环境里有 HTTP_PROXY=127.0.0.1:16668。**不设置 NO_PROXY 会导致连 localhost 都走代理而失败**。
    must_set: "export NO_PROXY=localhost,127.0.0.1 no_proxy=localhost,127.0.0.1"
  python:
    usable: "/d/tools/Python/python.exe（系统 Python 3.12，**带 pytest 与 requests**）"
    not_usable: "托管 python 3.13 **没有** pytest"
    windows_path_note: '给 Windows 版 python 传路径要用 D:/... 形式（不认 /d/...）'
  run_commands:
    all: "cd tests && python -m pytest"
    smoke: "cd tests && python -m pytest -m smoke"
    read_only: "cd tests && python -m pytest -m read"
    single_file: "cd tests && python -m pytest api/test_post.py -v"
  pytest_ini:
    testpaths: api
    python_files: "test_*.py"
    addopts: "-v --tb=short --strict-markers --color=yes"
    markers:
      - {name: smoke, desc: 冒烟用例，覆盖主流程，应始终通过}
      - {name: read, desc: 只读用例，不修改任何数据，可重复执行}
      - {name: write, desc: 写入用例，会在数据库中留下记录}
    strict_markers_warning: >-
      `--strict-markers` 已开启：使用**未登记的 marker 会直接报错**。
      只能用上面三个。

# ═══════════════════════════════════════════════════════════════
# 2. 硬纪律（红线，违反即"把测试改绿"，项目明令禁止）
# ═══════════════════════════════════════════════════════════════
hard_rules:
  - id: HR-01
    rule: "不许把测试改绿。"
    forbidden:
      - "删除测试"
      - "加 skip / xfail"
      - "放宽断言（如把 == 403 改成 in (403, 500)）"
      - "捕获异常后忽略"
      - "改测试数据掩盖 Bug"
    correct: "测试红了先查被测代码，再查测试；顺序不能反"
    source: docs/testing/MIQU_TEST_SYSTEM.md §6 第 1 点

  - id: HR-02
    rule: "断言用**差值**，不用绝对值。"
    wrong: 'assert admin_client.get("/api/admin/stats").data["userTotal"] == 21'
    right: |
      before = admin_client.get("/api/admin/stats").data["userTotal"]
      anonymous.register(f"qa{unique_suffix}")
      after = admin_client.get("/api/admin/stats").data["userTotal"]
      assert after == before + 1
    sole_exception: "针对**种子数据样本**的绝对值断言（post 1 有 9 张图；见 data/seed_data.yaml → designed_assertion_baselines）"
    why: "写入真实落库、且**没有删除用户的接口**，库会随运行次数增长"
    source: docs/testing/MIQU_TEST_SYSTEM.md §6 第 2 点

  - id: HR-03
    rule: "写数据只用**当次运行新建的随机用户**（fresh_user / fresh_users），不要改种子账号。"
    why: "① 用户名必须随机，否则第二次运行撞 uk_username；② 种子账号是 JUnit 绝对值断言的基准"
    forbidden_targets:
      - "改任何种子账号的密码（无恢复接口）"
      - "禁用 admin（会锁死管理端测试）"
      - "删除种子动态 post 1/2/3"
      - "改 test001 ↔ test002 的互关关系"
    source: tests/README.md §两条纪律 2

  - id: HR-04
    rule: "种子绝对值断言失效时的正确处理是**重置数据库**，不是改断言。"
    source: docs/testing/MIQU_TEST_SYSTEM.md §6 第 4 点

  - id: HR-05
    rule: "**永远不要断言 HTTP 状态码**。"
    wrong: "assert response.status_code == 403"
    right: "assert response.code == 403"
    sole_exception: >-
      /uploads/** 静态资源缺失时是**真 HTTP 404**；
      唯一合法的写法是 `assert response.http_status == 404`
    source: 见 api/conventions.yaml → http_status_policy

  - id: HR-06
    rule: "程序化探测**不要用 shell 里批量 curl**。"
    why: >-
      本机 bash 工具的输出管道会截断/损坏长字符串（180 字符的 JWT 打印出来只剩 22 字符），
      批量 curl 还会假报 "client returned ERROR on write"，看起来像远端全挂，实际是工具假象。
    correct: "用 Node 的 fetch 在**单进程**里顺序验证；或单个 curl 写**真实文件**后再用 Read 读"
    tool_precedent: [.workbuddy/tools/validation_order_probe.mjs, .workbuddy/tools/auth_layer_probe.mjs]

