# Miqu 业务规则知识库
#
# 用途：**整个知识库最重要的部分**。AI 生成测试场景的主依据。
#       让 AI 不再靠"社交应用的常识"猜这个项目该怎么测，而是按这里写明的真实规则测。
# 消费者：
#   LLM               → 生成测试场景与用例（given/when/then 直接映射为 setup/action/assert）
#   Pydantic          → 校验 rule_id 引用是否存在
#   BusinessValidator → 逐条比对预期 code 与 message
#   CoverageValidator → 统计规则覆盖率（本文件是规则的权威清单）
#
# 真相来源：backend/src/main/java/com/miqu/service/impl/**（逐行读取）
#           backend/src/main/java/com/miqu/common/ErrorCode.java
#           test_cases/core_business_rules.yaml + security_and_concurrency.yaml（已有 100 条用例登记）
#           docs/testing/bug_report.md（历史缺陷，说明哪些规则是踩坑后钉死的）
#
# confidence 分级：
#   CONFIRMED = 源码/Schema/API/数据库/正式文档直接确认
#   INFERRED  = 通过代码逻辑推断（**AI 使用前应先实测确认**）
#   UNKNOWN   = 无法确认（**禁止当作事实断言**）
#
# ═══════════════════════════════════════════════════════════════
# ID 纪律（必须遵守，否则会破坏项目已有体系）
# ═══════════════════════════════════════════════════════════════
#
# 本项目已有一套 ID 体系，定义在 docs/testing/TEST_CASE_SCHEMA.md §3，
# 校验在 test_cases/check_consistency.py 的 VALID_PREFIXES（14 个前缀）：
#   AUTH USER FOL POST LIKE CMT CONV MSG NOTI SRCH FILE SEC CONC SMK
#
# 现有登记状况（2026-09-16 实测统计）：
#   已登记（test_cases/*.yaml 共 100 条）：
#     CONC 12 | CONV 13 | FILE 12 | FOL 6 | LIKE 4 | MSG 14 | SEC 12 | SMK 27
#   **完全未登记（YAML 层为空，规则只活在 pytest/JUnit 代码里）**：
#     AUTH | USER | POST | CMT | NOTI
#
# 本文件的策略：
#   1. 已登记的 ID（CONV/MSG/FILE/SEC/CONC/FOL/LIKE）**只引用不复制**
#      —— 内容以 test_cases/*.yaml 为准，本文件仅在 existing_cases 里指向它，
#         避免制造第二份真相（这是 test_cases/README.md 的核心纪律）。
#   2. 未登记的五个域（AUTH/USER/POST/CMT/NOTI）**在此首次结构化**，
#      这是本知识库补齐的最大价值：让 AI 拿到这些域的可校验规则，而不是靠猜。
#   3. 新增 ID 从各域现有最大序号 +1 开始，**不复用、不改含义**（同项目纪律）。
#   4. 举报域无前缀，提议用 RPT-，但需先扩展 VALID_PREFIXES 才能落 test_cases/（见 issues.yaml C-05）。
#
# ⚠️ 本文件是**规则事实库**，不是用例登记库。用例的家在 test_cases/ 与 tests/。
#    这里的 existing_cases 只是**指针**，用于双向追溯。

