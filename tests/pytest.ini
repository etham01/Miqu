[pytest]
testpaths = api
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

markers =
    smoke: 冒烟用例，覆盖主流程，应始终通过
    read: 只读用例，不修改任何数据，可重复执行
    write: 写入用例，会在数据库中留下记录

# 后端地址可用环境变量或 --base-url 覆盖
# MIQU_BASE_URL=http://localhost:8081
