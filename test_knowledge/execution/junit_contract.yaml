# ═══════════════════════════════════════════════════════════════
# 6. 可复制模板
# ═══════════════════════════════════════════════════════════════
templates:

  - id: JT-01
    name: 标准控制器测试类骨架
    code: |
      package com.miqu.post;

      import com.miqu.support.BaseControllerTest;
      import org.junit.jupiter.api.DisplayName;
      import org.junit.jupiter.api.Test;
      import org.springframework.http.MediaType;

      import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.delete;
      import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
      import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.post;
      import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;
      import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;

      @DisplayName("动态接口 /api/posts")
      class PostControllerTest extends BaseControllerTest {

          @Test
          @DisplayName("未登录发动态 → 401")
          void create_withoutToken() throws Exception {
              mockMvc.perform(post("/api/posts")
                              .contentType(MediaType.APPLICATION_JSON)
                              .content("{\"content\":\"hi\"}"))
                      .andExpect(status().isOk())              // HTTP 恒 200
                      .andExpect(jsonPath("$.code").value(401)) // 业务码才是断言对象
                      .andExpect(jsonPath("$.message").value("未登录或登录状态已失效"));
          }
      }

  - id: JT-02
    name: 带 Token 的业务用例
    code: |
      @Test
      @DisplayName("关注自己 → 400")
      void follow_self() throws Exception {
          String token = login("test001", "123456");     // 基类方法
          mockMvc.perform(post("/api/users/2/follow")     // test001 的 id 是 2
                          .header("Authorization", bearer(token)))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(400))
                  .andExpect(jsonPath("$.message").value("不能关注自己"));
      }

  - id: JT-03
    name: 自己签发 Token（测"禁用前的旧 Token"这类场景）
    code: |
      // 关键技巧：被测账号已被禁用时，**登录接口拿不到 token**，
      // 必须用 JwtTokenProvider 直接签一个"合法但所属账号已失效"的 Token，
      // 才能验证"每请求查库校验状态"这条实现。
      @Autowired
      private JwtTokenProvider jwtTokenProvider;

      @Test
      @DisplayName("账号被禁用后，已签发的旧 Token 立即失效 → 423")
      void tokenIssuedBeforeBanIsRejected() throws Exception {
          // banned001（id=12）状态为禁用，只能直接签发 Token
          String token = jwtTokenProvider.generate(12L, "banned001", 1);

          mockMvc.perform(get("/api/users/me").header("Authorization", bearer(token)))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(423))
                  .andExpect(jsonPath("$.message").value("账号已被禁用，请联系管理员"));
      }
    role_parameter_note: "generate 的第三个参数是 role（1=USER，2=ADMIN）。测越权时传 2 可伪造管理员身份 —— 但**注意**这样绕过了真实登录，只用于边界探测。"

  - id: JT-04
    name: 读响应体后用 AssertJ 断言复杂结构
    code: |
      @Test
      @DisplayName("动态详情：图片顺序与数量")
      void postDetail_images() throws Exception {
          String token = login("test001", "123456");
          JsonNode json = exec(get("/api/posts/1").header("Authorization", bearer(token)));

          assertThat(json.path("code").asInt()).isEqualTo(200);
          JsonNode data = json.path("data");
          assertThat(data.path("id").asText()).isEqualTo("1");       // id 是字符串
          assertThat(data.path("images")).hasSize(9);                // 种子绝对值（合法例外）
          assertThat(data.path("likeCount").asInt()).isEqualTo(10);  // 计数是数字
      }

  - id: JT-05
    name: 参数化边界
    code: |
      @ParameterizedTest
      @ValueSource(strings = {"", "ab", "1abc", "a b", "a" + "b" * 20})
      @DisplayName("非法用户名一律 400")
      void register_invalidUsername(String username) throws Exception {
          String body = objectMapper.writeValueAsString(Map.of(
                  "username", username, "password", "123456",
                  "nickname", "n", "email", "qa_x@miqu.test"));
          mockMvc.perform(post("/api/auth/register")
                          .contentType(MediaType.APPLICATION_JSON).content(body))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(400));
      }

  - id: JT-06
    name: 越权矩阵（参数化"未登录 / 非管理员 / 管理员"）
    code: |
      private static final List<String> ADMIN_GET_PATHS = List.of(
              "/api/admin/stats", "/api/admin/users", "/api/admin/posts",
              "/api/admin/comments", "/api/admin/reports", "/api/admin/logs");

      @ParameterizedTest
      @MethodSource("adminPaths")
      @DisplayName("后台 GET：未登录 401 / 普通用户 403 / 管理员 200")
      void adminAccessMatrix(String path) throws Exception {
          mockMvc.perform(get(path))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(401));

          mockMvc.perform(get(path).header("Authorization", bearer(login("test001", "123456"))))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(403));

          mockMvc.perform(get(path).header("Authorization", bearer(login("admin", "123456"))))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.code").value(200));
      }

      static Stream<String> adminPaths() { return ADMIN_GET_PATHS.stream(); }
    coverage_gap: >-
      ⚠️ 现有实现只覆盖 **7 个 GET**。4 个**写**接口（PUT users/{id}/status、
      DELETE posts/{id}、DELETE comments/{id}、PUT reports/{id}/handle）**未纳入矩阵** ——
      这是推荐补的覆盖增量。

# ═══════════════════════════════════════════════════════════════
# 7. 反模式
# ═══════════════════════════════════════════════════════════════
anti_patterns:
  - id: JAP-01
    wrong: ".andExpect(status().is4xxClientError())"
    why: "HTTP 恒 200，这条断言恒假"
    right: ".andExpect(jsonPath(\"$.code\").value(403))"
  - id: JAP-02
    wrong: "自己 new MockMvc 或加 @AutoConfigureMockMvc 到子类"
    why: "基类已配好；重复配置会启动多个上下文，测试变慢"
    right: "继承 BaseControllerTest"
  - id: JAP-03
    wrong: "去掉 @Transactional 以「让数据真的落库」"
    why: "会污染后续用例（JUnit 依赖种子绝对值）"
    right: "需要真实落库验证的用例改用 pytest"
  - id: JAP-04
    wrong: "断言 PARAM_INVALID 的默认文案「参数校验失败」"
    why: "实际几乎总是被替换成具体字段文案"
    right: "断言具体文案，或只断 code"
  - id: JAP-05
    wrong: "在 JUnit 里写多线程并发用例"
    why: "MockMvc 事务与线程绑定，多线程下回滚失效；且项目已把并发放在 pytest"
    right: "并发用例放 tests/api/test_concurrency.py"
  - id: JAP-06
    wrong: "为 EMPTY_COMMENT / targetType=4 的 INVALID_TARGET_TYPE 写用例"
    why: "死分支，必然拿不到预期码（rules/validation_order.yaml §4）"
    right: "先查死分支清单"
  - id: JAP-07
    wrong: "忘了先重置数据库就跑 mvn test"
    why: "种子绝对值断言漂移 → 大面积红，误判为代码缺陷"
    right: "先重置库"
  - id: JAP-08
    wrong: "注册固定用户名做写操作（不用随机后缀）"
    why: "回滚虽能兜住，但一旦用例失败在事务外，残留会撞唯一键"
    right: "用 UUID 后缀"

# ═══════════════════════════════════════════════════════════════
# 8. 选型建议（AI 决定"这条用例写在哪"）
# ═══════════════════════════════════════════════════════════════
when_to_use:
  junit:
    - "规则密集的分支覆盖（校验顺序、越权组合、状态迁移）"
    - "依赖种子数据绝对值断言的用例"
    - "需要构造「不可能通过 API 达到」的前置（如已禁用账号的旧 Token）"
    - "需要隔离环境、不想污染数据的写操作用例"
  pytest:
    - "端到端契约：序列化类型、响应信封、分页结构"
    - "跨接口流程（注册→登录→发帖→互动）"
    - "过滤器链与拦截器链的实际行为"
    - "文件上传与其他涉及真实 I/O 的场景"
    - "并发竞态（唯一键兜底）"
  browser:
    - "前端状态一致性（标签与数据是否同源）"
    - "UI 降级行为（头像加载失败）"
  nowhere:
    - "数十线程同一瞬间首建会话（CONC-007，属压测范畴，当前未做）"
    - "前端单元/组件测试（项目有意不引入 Vitest）"

ai_checklist:
  - "先判断这条用例该放哪：见 §8 when_to_use"
  - "HTTP 一律 status().isOk()，断言 jsonPath(\"$.code\")"
  - "message 断言前查 api/error_codes.yaml 的 message_assertable"
  - "跑之前先重置数据库（§1）"
  - "别写并发用例（放 pytest）"
