# 覆盖矩阵（Coverage Matrix）
#
# 用途：回答「**哪些东西被覆盖、哪些没有**」，并且**按维度**回答 ——
#       Feature / API / Rule / Parameter / Role / State / Workflow / Category。
#
# 为什么它必须可被程序消费：
#   覆盖判定不能靠人读文档。CoverageValidator 应该能直接读本文件，
#   算出"这个 requirement 生成的用例覆盖了几条规则、还差哪些"。
#
# 与 test_policy.yaml 的分工：
#   test_policy.yaml     → 决定**生成哪些类别**
#   coverage_matrix.yaml → 判定**覆盖是否达标**（本文件是唯一度量来源）
#
# 消费者：CoverageValidator（主数据源）｜LLM（找空白，决定优先补什么）｜执行器（不必读）
#
# 真相来源：
#   api/endpoints.yaml（50 端点）｜rules/business_rules.yaml（规则）｜
#   existing_tests.yaml（现有覆盖）｜test_cases/*.yaml（登记状态）｜
#   permissions/permission_matrix.yaml｜states/state_machines.yaml｜workflows/workflows.yaml
#
# confidence: CONFIRMED
# verified_at: 2026-09-17

meta:
  generated_at: 2026-09-17
  chain: "Feature → API → Business Rule → Test Scenario → Test Case → Automated Test"
  levels: [feature, api, rule, scenario, case, automation]
  baseline:
    endpoints: 50
    rule_ids_mentioned: 92
    junit_cases: 291
    pytest_cases: 250
    browser_assertions: 15
    yaml_registered: 100
  coverage_convention: >-
    覆盖状态只有四档，**不允许模糊表述**：
      covered   = 有自动化断言，且指得出具体用例名
      partial   = 只覆盖了该规则的部分分支（写明缺哪一支）
      gap       = 无自动化覆盖，已登记（写明原因）
      unreachable = 代码存在但 HTTP 层不可触达（不是"没测"，是"测不了"）

