      branch: "INVALID_TARGET_TYPE(400) —— targetType=4 分支"
      location: ReportServiceImpl.java:74-76
      reason: "CreateReportRequest 的 @Max(3) 在 layer 3 先拦为 PARAM_INVALID"
      actual_code: "400 PARAM_INVALID，文案'举报目标类型只能是 1、2 或 3'"
      evidence: "validation_order_probe P10 实测"
      corresponding_issue: C-03

    - id: DB-03
      branch: "CANNOT_DISABLE_ADMIN(403) —— 管理员禁用另一个管理员"
