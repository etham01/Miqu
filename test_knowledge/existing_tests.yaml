      suggested: "pytest：4 × 2 = 8 条"
      value: 高
      registered: docs/api/README.md §11.3

    - id: IO-02
      gap: "pytest 未直接断言 4 个端点"
      detail: "GET /api/health、GET /api/posts/{id}/likes、GET /api/users/{id}/following、GET /api/users/{id}/followers"
      suggested: "pytest：为这 4 个补直接断言（含游客可访问、分页、followedByMe 回填）"
      value: 中
      note: "这 4 个有 JUnit 覆盖，属「口径补齐」而非「能力补齐」"

    - id: IO-03
      gap: "POST /api/reports 的用户侧异常契约未被 pytest 断言"
      detail: "只被当后台场景的前置数据创建；CANNOT_REPORT_SELF / ALREADY_REPORTED / 目标不存在 的 HTTP 契约只在 JUnit"
      suggested: "pytest：3~5 条用户侧负向用例"
      value: 中

    - id: IO-04
      gap: "「不能禁用另一个管理员」(CANNOT_DISABLE_ADMIN) HTTP 层不可达"
      detail: "种子只有 1 个管理员 → 无输入可触达（SEC-004 缺口）"
      suggested: "补第二个管理员种子账号，或写直接调 Service 的集成测试"
      value: 中
      blocking: "需要先改种子数据，属**决策项**，不要擅自改"

