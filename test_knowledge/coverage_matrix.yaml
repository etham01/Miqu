    - {category: CAT-concurrency, covered: partial, note: "6/7（CONC-007 gap）"}
    - {category: CAT-idempotency, covered: true}
    - {category: CAT-serialization, covered: true, note: "ResponseSerializationTest(6) 专测"}
    - {category: CAT-exception-branch, covered: true}

# ═══════════════════════════════════════════════════════════════
# 9. 覆盖查询（CoverageValidator 应该能回答的问题）
# ═══════════════════════════════════════════════════════════════
queries:
  desc: "本文件的设计目标是让下面这些问题都能用**程序**回答，而不是靠人读文档。"
  supported:
    - q: "这个业务规则有没有测试？"
      data_path: "rule_layer.domains[].automated + rules/business_rules.yaml[].existing_cases"
    - q: "这个 API 有没有测试？"
      data_path: "api_layer.per_module + api/endpoints.yaml[].existing_cases"
    - q: "这个参数有没有边界测试？"
      data_path: "parameter_layer.status[]"
    - q: "这个角色有没有覆盖？"
      data_path: "role_layer.status[]"
    - q: "这个状态转换有没有覆盖？"
      data_path: "state_layer.status[].transitions_covered"
    - q: "这个流程有没有端到端覆盖？"
      data_path: "workflow_layer.status[]"
    - q: "这条规则在哪几个测试里被断言？"
      data_path: "rules/business_rules.yaml[].existing_cases（指针，不复制内容）"
    - q: "还有哪些缺口可以补？"
      data_path: "issues.yaml 的 MISSING 段 + existing_tests.yaml → incremental_opportunities"

# ═══════════════════════════════════════════════════════════════
# 10. 覆盖达标线（CoverageValidator 判定用）
# ═══════════════════════════════════════════════════════════════
thresholds:
  desc: "生成结果必须同时满足下列条件才算「覆盖达标」，否则进入 Retry/Repair。"
  gates:
    - {id: CG-01, gate: "每个被要求的 feature 至少命中 1 条用例"}
    - {id: CG-02, gate: "每个被引用的 API 必须存在于 api/endpoints.yaml"}
    - {id: CG-03, gate: "每个被引用的 rule_id 必须存在于 business_rules.yaml 或 test_cases/*.yaml 或本知识库"}
    - {id: CG-04, gate: "生成的 category 集合必须覆盖 test_policy 中该 requirement 的 required_categories 子集"}
    - {id: CG-05, gate: "所有「叠加违规」用例的预期码必须与 validation_order.yaml 一致"}
    - {id: CG-06, gate: "涉及计数的用例必须包含 2 条独立断言（计数 + 关系行数）"}
    - {id: CG-07, gate: "涉及权限的用例必须覆盖至少 2 种身份状态"}
    - {id: CG-08, gate: "不得为 unreachable_items 生成用例（命中即判不通过）"}
  retry_policy:
    on_fail: "把失败原因（缺失的 category / 不存在的 rule_id / 顺序不符）回灌给 LLM 重新生成"
    max_retries: 3
    escalate: "3 次仍不达标 → 标记为需人工介入，不要强行通过"

ai_checklist:
  - "找空白优先看 issues.yaml 的 MISSING 段，其次 §1 features 里 coverage: partial 的项"
  - "不要为 unreachable_items 生成用例（CG-08）"
  - "生成后按 §10 的 8 条 gate 自检，不达标就重生成而不是交给执行器"
  - "本文件是覆盖判定的**唯一来源**，不要另建一套覆盖口径"
